<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b6b3a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2214%22 font-size=%2214%22%3E🌻%3C/text%3E%3C/svg%3E">
<title>雙寶知識花園保衛戰</title>
<style>
:root{--ink:#1d2433;--ink2:#5b6475;--bg:#1f3b2a;--pan:#fffaf0;--line:#2a2a3a;--sun:#ffd23f;--ok:#2fb36b;--bad:#e5484d;--sky:#7fd6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overscroll-behavior:none}
body{background:repeating-linear-gradient(45deg,#24452f 0 16px,#20402b 16px 32px)}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.scr{display:none;min-height:100%;}
.scr.on{display:block}
.pbtn{border:4px solid var(--line);background:#fff;border-radius:0;padding:12px 18px;font-weight:800;font-size:20px;box-shadow:4px 4px 0 var(--line);color:var(--ink)}
.pbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.pbtn.sun{background:var(--sun)}.pbtn.mint{background:#7ee2a8}.pbtn.sky{background:var(--sky)}.pbtn.pink{background:#ff9fb5}.pbtn.gray{background:#d9dde5}
.pbtn:disabled{opacity:.45}
.card{background:var(--pan);border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35)}
#scr-title .box{max-width:760px;margin:0 auto;padding:28px 18px;text-align:center}
.logo{background:#fffaf0;border:6px solid var(--line);box-shadow:8px 8px 0 #0006;padding:18px 12px;margin:10px 0 22px}
.logo h1{margin:6px 0;font-size:44px;line-height:1.15;color:#2b6b3a;text-shadow:3px 3px 0 #ffd23f}
.logo p{margin:4px 0;color:var(--ink2);font-size:17px}
#titleArt{width:100%;max-width:560px;image-rendering:pixelated;display:block;margin:8px auto}
.kids{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:10px 0 18px}
.kid{min-width:230px;padding:18px;font-size:24px}
.kid.on{outline:6px solid var(--sun);outline-offset:2px}
.kid small{display:block;font-size:15px;font-weight:600;color:var(--ink2);margin-top:4px}
.trow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
a.back{color:#d8f5e0;font-size:16px;display:inline-block;margin-top:20px}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#163020;color:#fff;border-bottom:4px solid #0b1a10;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h2{margin:0;font-size:22px;flex:1}
.chip{background:#fffaf0;color:var(--ink);border:3px solid var(--line);padding:4px 10px;font-weight:800;font-size:17px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
.tabs button{border:3px solid var(--line);background:#fffaf0;padding:8px 14px;font-weight:800;font-size:17px}
.tabs button.on{background:var(--sun)}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:6px 14px 30px}
.lvl{text-align:left;padding:14px;position:relative}
.lvl h3{margin:2px 0 6px;font-size:21px}
.lvl .u{font-size:17px;color:var(--ink);font-weight:700}
.lvl .meta{font-size:14px;color:var(--ink2);margin-top:6px}
.lvl .st{position:absolute;right:12px;top:10px;font-size:20px;letter-spacing:2px;color:#e0a000}
.subj{display:inline-block;padding:2px 8px;border:2px solid var(--line);font-size:14px;font-weight:800}
#side{display:none}
#scr-game.scr.on{display:flex;flex-direction:column;height:100%;height:100dvh;max-height:100dvh;overflow:hidden;min-height:0}
#game{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;max-width:1200px;margin:0 auto;position:relative;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#play{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 8px;background:#163020;color:#fff;border-bottom:3px solid #0b1a10;position:relative;z-index:9;flex-wrap:wrap}
#hud .hb{border:3px solid var(--line);background:#fffaf0;color:var(--ink);font-weight:900;padding:4px 10px;font-size:19px;white-space:nowrap}
#hud .sunv{background:var(--sun);min-width:96px;text-align:center}
#hud .ask{background:var(--sun);font-size:22px;padding:6px 16px;box-shadow:3px 3px 0 #0006;display:none}
#hud .gowave{background:#7ee2a8;font-size:20px;padding:6px 14px;box-shadow:3px 3px 0 #0006;display:none}
#hud .ask.on,#hud .gowave.on{display:inline-block}
#hud .ask.pulse{animation:askpulse 1.2s ease-in-out infinite}
@keyframes askpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#wavebar{flex:1;height:24px;border:3px solid var(--line);background:#334;position:relative;min-width:80px}
#wavebar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff7a59,#ffd23f)}
#wavebar span{position:absolute;inset:0;text-align:center;font-size:13px;font-weight:900;line-height:18px;color:#fff;text-shadow:1px 1px 0 #000}
#pausetag{display:none;background:#7fd6ff !important}
#pausetag.on{display:inline-block}
#stage{flex:1 1 auto;min-height:0;position:relative;background:#0b1a10;line-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{width:auto;height:auto;max-width:100%;max-height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;flex:0 0 auto}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:#fffaf0;border:5px solid var(--line);box-shadow:6px 6px 0 #0008;padding:12px 22px;font-size:26px;font-weight:900;line-height:1.3;text-align:center;display:none;pointer-events:none;max-width:90%;z-index:3}
#banner.boss{background:#ffdfe6;color:#9b1030}
#seeds{flex:0 0 auto;display:flex;gap:6px;padding:6px;background:#5a3a22;border-top:3px solid #2b1a0e;border-bottom:3px solid #2b1a0e;overflow-x:auto;z-index:2}
.seed{position:relative;flex:0 0 auto;width:94px;border:3px solid var(--line);background:#fff3d6;padding:3px 2px 2px;text-align:center;line-height:1.1;overflow:hidden}
.seed img{width:56px;height:56px;image-rendering:pixelated;display:block;margin:0 auto}
.seed b{display:block;font-size:13px}
.seed .cost{font-size:15px;font-weight:900;color:#7a4b00}
.seed .cdv{position:absolute;left:0;right:0;top:0;background:rgba(20,20,30,.55)}
.seed.sel{background:#ffe066;outline:4px solid #fff;outline-offset:-7px}
.seed.no{filter:grayscale(.8);opacity:.7}
.seed .home{position:absolute;right:2px;top:2px;font-size:12px;background:#ff7a59;color:#fff;padding:0 3px;border:2px solid var(--line)}
.tool{width:74px}
.tool .ic{font-size:34px;line-height:56px;height:56px}
#qp{display:none;position:absolute;inset:0;z-index:8;background:rgba(8,16,10,.84);overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 16px}
#qp.on{display:block}
#qpw{background:var(--pan);border:4px solid var(--line);box-shadow:6px 6px 0 #0006;padding:12px 14px 16px;max-width:720px;margin:0 auto}
.qmode{font-weight:900;font-size:18px;margin:0 0 8px;padding:6px 10px;border:3px solid var(--line);background:#7fd6ff;display:inline-block}
.qh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{border:2px solid var(--line);padding:1px 7px;font-size:14px;font-weight:800;background:#fff}
.tag.hard{background:#ffe066}.tag.fmt{background:#d6f0ff}.tag.stk{background:#ff9f7a}
.qpass{background:#fff;border:3px dashed #8a7a5a;padding:8px 10px;font-size:17px;line-height:1.6;margin:6px 0;max-height:230px;overflow:auto}
.qtbw{overflow-x:auto;margin:6px 0}
.qtb{border-collapse:collapse;font-size:16px;background:#fff}
.qtb th,.qtb td{border:2px solid #555;padding:4px 8px;text-align:center}
.qtb th{background:#e9f6ee}
.qtb caption{font-weight:800;text-align:left;padding:2px 0;font-size:15px}
.qq{font-size:22px;font-weight:800;line-height:1.45;margin:6px 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:3px solid var(--line);background:#fff;padding:12px 12px 12px 50px;font-size:19px;font-weight:700;position:relative;line-height:1.4;min-height:56px;box-shadow:3px 3px 0 var(--line);color:var(--ink)}
.opt:before{content:attr(data-l);position:absolute;left:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;line-height:24px;text-align:center;border:3px solid var(--line);background:var(--sun);font-weight:900}
.opt.bad{background:#ffe1e1;text-decoration:line-through;color:#8a2a2a}
.opt.ok{background:#d9f7e3;border-color:#137a43;color:#0b4a28}
.fb{margin-top:10px;border:3px solid var(--line);padding:10px 12px;font-size:17px;line-height:1.55;display:none}
.fb.hint{display:block;background:#fff6cf}
.fb.good{display:block;background:#dcf7e6}
.fb b{font-size:18px}
.nextrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.nextrow .pbtn{font-size:18px;padding:9px 16px}
.autobar{flex:1;height:10px;background:#ddd;border:2px solid var(--line);position:relative}
.autobar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);width:0}
.mnote{font-size:15px;color:var(--ink2);margin:4px 0}
.mitems{display:grid;gap:6px}
.mi{text-align:left;border:3px solid var(--line);background:#fff;padding:10px 10px 10px 46px;font-size:18px;font-weight:700;position:relative;min-height:50px;color:var(--ink)}
.mi .bx{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:3px solid var(--line);background:#fff;line-height:22px;text-align:center;font-weight:900}
.mi.on{background:#fff3b0}.mi.on .bx{background:var(--sun)}
.mi.ok{background:#d9f7e3}.mi.bad{background:#ffe1e1}
.mrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:2px dashed #ccc;padding:6px 0}
.mrow b{flex:1 1 180px;font-size:17px}
.mc{border:3px solid var(--line);background:#fff;min-width:46px;height:44px;font-weight:900;font-size:18px;color:var(--ink)}
.mc.on{background:var(--sun)}
.mlegend{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.mlegend span{border:2px solid #777;padding:1px 6px;font-size:14px;background:#fff}
.mseq{font-size:16px;font-weight:700}
.mact{display:flex;gap:8px;margin-top:8px}
.mact .pbtn{font-size:18px;padding:9px 16px}
.fly{position:fixed;z-index:50;font-weight:900;font-size:28px;color:#ffb000;text-shadow:2px 2px 0 #000;pointer-events:none;transition:transform 1s ease-out,opacity 1s}
#ov{position:fixed;inset:0;background:rgba(8,16,10,.72);display:none;align-items:center;justify-content:center;z-index:40;padding:14px}
#ov.on{display:flex}
#ovb{max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:18px 18px 20px;text-align:center}
#ovb h2{margin:4px 0 8px;font-size:30px}
.stars{font-size:52px;letter-spacing:6px;margin:4px 0}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.res div{border:3px solid var(--line);background:#fff;padding:8px;font-weight:800;font-size:15px}
.res div b{display:block;font-size:24px}
.wrongs{text-align:left;font-size:15px;line-height:1.5;margin:8px 0;background:#fff;border:3px solid var(--line);padding:8px 10px 8px 30px;max-height:220px;overflow:auto}
.wrongs li{margin-bottom:6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px 14px 30px}
.badge{padding:10px;text-align:center}
.badge .e{font-size:40px}.badge.off{opacity:.5;filter:grayscale(1)}
.badge b{display:block;font-size:18px}.badge small{display:block;color:var(--ink2);font-size:13px;line-height:1.4;margin-top:4px}
.newb{display:inline-block;margin:4px;padding:4px 10px;border:3px solid var(--line);background:#fff3b0;font-weight:800}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:12px 14px 30px}
.shop .card{padding:12px;text-align:center}
.shop img{width:72px;height:72px;image-rendering:pixelated}
.shop p{font-size:15px;color:var(--ink2);margin:6px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fffaf0;border:4px solid var(--line);padding:10px 16px;font-weight:800;font-size:18px;z-index:60;display:none;box-shadow:4px 4px 0 #0007;max-width:92%;text-align:center}
.help{font-size:16px;line-height:1.6;text-align:left}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px dashed #ccc;padding:10px 0;font-size:18px;font-weight:700;text-align:left}
input.story{width:100%;font:inherit;font-size:18px;padding:10px;border:3px solid var(--line)}
@media (orientation:landscape) and (min-width:900px){
  #qp{background:rgba(8,16,10,.28);padding:0;display:none}
  #qp.on{display:block}
  #qpw{position:absolute;right:0;top:0;bottom:0;width:min(460px,42%);max-width:520px;margin:0;height:100%;overflow-y:auto;border-left:4px solid var(--line);border-top:0;box-shadow:-8px 0 0 #0004}
}
@media (max-width:600px){.logo h1{font-size:32px}.qq{font-size:19px}.opt{font-size:17px}.seed{width:78px}.seed img{width:44px;height:44px}#hud .hb{font-size:15px;padding:3px 6px}#hud .ask{font-size:17px;padding:4px 10px}#hud .gowave{font-size:16px;padding:4px 10px}}
</style>
</head>
<body>
<section class="scr on" id="scr-title"><div class="box">
  <div class="logo">
    <h1>🌻 雙寶知識花園保衛戰</h1>
    <p>每一波開始前先答題存「知識陽光」，再種下守護植物，擋住錯字怪和粗心怪！</p>
    <canvas id="titleArt" width="280" height="96"></canvas>
  </div>
  <div class="kids" id="kids"></div>
  <div class="trow"><button class="pbtn sun" data-go="levels" style="font-size:26px;padding:14px 34px">▶ 開始闖關</button></div>
  <div class="trow">
    <button class="pbtn mint" data-go="shop">🛒 種子商店</button>
    <button class="pbtn sky" data-go="badges">🏅 心之力徽章</button>
    <button class="pbtn gray" data-act="help">❓ 怎麼玩</button>
    <button class="pbtn gray" data-act="settings">⚙️ 設定</button>
  </div>
  <a class="back" href="../">← 回到「雙寶複習冒險隊」（寵物遊戲）</a>
</div></section>
<section class="scr" id="scr-levels">
  <div class="top"><button class="pbtn gray" data-go="title" style="font-size:16px;padding:6px 12px">← 首頁</button><h2 id="lvTitle">選關卡</h2><span class="chip" id="lvCoins"></span></div>
  <div class="tabs" id="subTabs"></div>
  <div class="lvls" id="lvls"></div>
</section>
<section class="scr" id="scr-shop">
  <div class="top"><button class="pbtn gray" data-go="title" style="font-size:16px;padding:6px 12px">← 首頁</button><h2>🛒 種子商店</h2><span class="chip" id="shopCoins"></span></div>
  <div class="shop" id="shopList"></div>
</section>
<section class="scr" id="scr-badges">
  <div class="top"><button class="pbtn gray" data-go="title" style="font-size:16px;padding:6px 12px">← 首頁</button><h2>🏅 心之力徽章</h2></div>
  <div class="badges" id="badgeList"></div>
</section>
<section class="scr" id="scr-game"><div id="game">
  <div id="hud">
    <button class="hb" data-act="pause" aria-label="暫停">⏸</button>
    <span class="hb sunv" id="sunv">☀ 0</span>
    <div id="wavebar"><i></i><span></span></div>
    <button class="hb ask" id="askbtn" data-act="ask">📝 答題</button>
    <button class="hb gowave" id="gowave" data-act="gowave">▶ 開始防守</button>
    <span class="hb" id="pausetag">⏸ 答題中，戰場已暫停</span>
    <span class="hb" id="heartv">❤❤❤</span>
  </div>
  <div id="play">
    <div id="stage"><canvas id="cv" width="512" height="272"></canvas><div id="banner"></div></div>
    <div id="seeds"></div>
    <div id="side"></div>
    <div id="qp"><div class="qwrap" id="qpw"></div></div>
  </div>
</div></section>
<div id="ov"><div class="card" id="ovb"></div></div>
<div id="toast"></div>
<script>
"use strict";
/* 雙寶知識花園保衛戰（塔防＋答題複習）
   題庫與「雙寶複習冒險隊」同一份；答案、提示、解說都加密，作答後才解開
   存檔：localStorage「shuangbao-garden-save」（和寵物遊戲的存檔完全分開） */

function placePlant(r, c){

function newMon(type, row, x){ const M = MON[type], hp = Math.round(M.hp * G.mult); return {type, row, x, hp, max:hp, sp:M.sp * G.spd, dps:M.dps, slow:0, hit:0, eat:false, fr:0, ft:Math.random() * .3, summon:type === "boss" ? 8 : 0, boss:type === "boss"}; }

function banner(html, ms, boss){ const b = $("banner"); b.innerHTML = html; b.className = boss ? "boss" : ""; b.style.display = "block"; clearTimeout(banner.t); banner.t = setTimeout(() => b.style.display = "none", ms || 2000); }
function puff(x, y, col, n){ if(!G) return; for(let i = 0; i < (n || 8); i++) G.fx.push({x, y, vx:(Math.random() - .5) * 70, vy:(Math.random() - .8) * 70, life:.45 + Math.random() * .3, col, s:2}); }
const isLongQ = q => !!(q && (q.mm || q.p || q.tb));
const slowFactor = () => 1;

function update(dt){
  if(!G || G.paused || G.asking || G.done) return;
  if(G.phase === "won" || G.phase === "lost" || G.phase === "quiz" || G.phase === "prep"){
    // 準備／答題回合不推進戰場；只讓已有特效慢慢淡出
    for(const f of G.fx){ f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 140 * dt; }

    return;
  }
  G.t += dt;
  for(const k in G.seedCd) if(G.seedCd[k] > 0) G.seedCd[k] = Math.max(0, G.seedCd[k] - dt);
  G.trickle += dt; if(G.trickle >= 12){ G.trickle = 0; G.sun += 10; }

    G.spawnT += dt;
    while(G.spawnQ.length && G.spawnQ[0].at <= G.spawnT) spawnMon(G.spawnQ.shift().type);
    if(!G.spawnQ.length && !G.mons.length){
      if(G.wave >= G.waves.length - 1){ winLevel(); return; }
      startQuiz(); return;
    }

      else { G.shots.push({k:p.type, x:px + 12, y, row:r, dmg, slow:D.kind === "slow"}); if(D.kind === "double") G.shots.push({k:p.type, x:px - 6, y:y + 5, row:r, dmg}); }

      if(f >= 1){ s.dead = true; for(const m of G.mons) if(Math.abs(m.row - s.row) <= 1 && Math.abs(m.x + 10 - s.tx) <= 40) hurt(m, s.dmg); puff(s.tx, s.ty, "#ff8a65", 14); puff(s.tx, s.ty, "#2a2340", 8); }
      continue; }
    s.x += 170 * dt;
    if(s.x > W + 10){ s.dead = true; continue; }
    const m = G.mons.find(m => !m.dead && m.row === s.row && s.x >= m.x + 2 && s.x <= m.x + (m.boss ? 44 : 28));
    if(m){ s.dead = true; hurt(m, s.dmg); if(s.slow) m.slow = 3; puff(s.x, s.y, s.k === "sci" ? "#bfeaff" : s.k === "eng" ? "#c8ffc8" : "#ffe066", 5); }
  }

  for(const m of G.mons){
    if(m.dead) continue;

function draw(){

  ctx.drawImage(SPR.house, 2, OY + 2 * CELL - 6, 44, 52);
  for(let r = 0; r < ROWS; r++) if(G.guards[r]) ctx.drawImage(SPR.book, r === 2 ? 26 : 12, rowY(r) + (r === 2 ? 34 : 16), r === 2 ? 18 : 24, r === 2 ? 15 : 20);
  for(const gf of G.guardFx) ctx.drawImage(SPR.book, gf.x, rowY(gf.row) + 12, 32, 27);
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){ const p = G.plants[r][c]; if(!p) continue;
    const s = p.hit > 0 ? SPR[p.type + "_hit"] : SPR[p.type], bob = DEF[p.type].kind === "wall" ? 0 : Math.round(Math.sin(p.bob * 3));

    if(p.hp < p.max){ ctx.fillStyle = "#222"; ctx.fillRect(colX(c) + 8, rowY(r) + 1, 32, 4); ctx.fillStyle = "#4cd964"; ctx.fillRect(colX(c) + 9, rowY(r) + 2, 30 * Math.max(0, p.hp / p.max), 2); }
  }

    const sc = m.boss ? 2 : 2, w = s.width * sc, h = s.height * sc, y = rowY(m.row) + CELL - h + (m.boss ? 8 : 2), x = Math.round(m.x - (m.boss ? 6 : 0));

  }
  for(const s of G.shots){
    if(s.k === "lob"){ ctx.fillStyle = "#1b1b2a"; ctx.fillRect(s.x - 5, s.y - 5, 10, 10); ctx.fillStyle = "#ff8a65"; ctx.fillRect(s.x - 4, s.y - 4, 8, 8); ctx.fillStyle = "#2a2340"; ctx.fillRect(s.x - 1, s.y - 4, 4, 4); continue; }

  <p>🪨 石堡城牆：擋怪　⚡ 雷電算盤花：射擊　❄️ 冰晶花：讓怪變慢　🔥 墨水火山：炸一整片　🌪️ 旋風雙發花：一次兩發</p>
  <p>6️⃣ 怪獸走到最左邊，📘 書本守衛會清掉一整排（每排一次）；守衛用完再被闖進就掉 ❤。靠近家的那一排會<b>紅燈閃爍</b>警告。</p>
  <p>7️⃣ 打完 4 波（最後是單元大魔王）就過關！</p></div>`; }
function renderSettings(){
  const row = (k, n, sub) => `<div class="set"><span>${n}<br><small style="font-weight:500;color:#5b6475">${sub}</small></span><button class="pbtn ${SV.set[k] ? "mint" : "gray"}" data-act="tg" data-k="${k}" style="font-size:16px;padding:6px 14px">${SV.set[k] ? "開" : "關"}</button></div>`;
  modal(`<h2>⚙️ 設定</h2>${row("easy", "輕鬆模式", "怪獸走得更慢、血少一點（建議開著）")}${row("sound", "音效", "答對、種植物、魔王出場的音效")}
    <p style="font-size:13px;color:#5b6475">版本 ${GARDEN_VERSION}｜存檔位置 localStorage「${SAVE_KEY}」（和寵物遊戲的存檔分開，舊進度會原封不動留下來）</p><div class="trow"><button class="pbtn sun" data-act="close">完成</button></div>`);
}
function pauseGame(){ if(!G || G.done) return; G.paused = true; modal(`<h2>⏸ 暫停</h2><p style="font-size:18px">${esc(G.g === "g4" ? G.card.u4 : G.card.u6)}｜Lv.${G.lv}</p><div class="trow"><button class="pbtn sun" data-act="resume">▶ 繼續</button><button class="pbtn gray" data-act="help">❓ 怎麼玩</button><button class="pbtn pink" data-act="quit">🚪 離開這關</button></div>`); }
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if(!b || b.disabled) return; const d = b.dataset;
  if(d.go){ go(d.go); return; }
  if(d.kid){ SV.cur = d.kid; save(); renderTitle(); return; }
  if(d.sub){ subTab = d.sub; renderLevels(); return; }
  if(d.lv){ startLevel(d.lv); return; }
  if(d.buy){ const D = DEF[d.buy], k = kid(); if(k.coins >= D.price){ k.coins -= D.price; k.unlock[d.buy] = 1; save(); toast(`🌱 解鎖 ${D.n}！`); renderShop(); } return; }
  if(d.upg){ const U = UPGRADES.find(u => u.k === d.upg), k = kid(); if(k.coins >= U.price){ k.coins -= U.price; k.upg[U.k] = 1; save(); toast(`${U.e} 買到 ${U.n}！`); renderShop(); } return; }
  if(d.seed){ if(!G || G.done || G.asking) return; G.sel = G.sel === d.seed ? null : d.seed;
    if(G.sel && G.sel !== "shovel"){ const D = DEF[G.sel]; if(G.sun < D.cost){ toast(`還差 ${D.cost - G.sun} ☀，答對題目就有！`); G.sel = null; } else if(G.seedCd[G.sel] > 0){ toast("種子還在充能中⋯"); G.sel = null; } else toast(`🌱 點草地種下「${D.n}」`, 1300); }
    else if(G.sel === "shovel") toast("🧹 點要移除的植物（退一半陽光）", 1300);
    renderSeedsLight(); return; }
  if(!G && (d.opt !== undefined || d.mtog !== undefined || d.mmap !== undefined)) return;
  if(d.opt !== undefined){ answer(Number(d.opt), ev); return; }
  if(d.mtog !== undefined){ if(G.qs.done) return; const sel = mqSel(G.q), k2 = Number(d.mtog), at = sel.indexOf(k2); if(at >= 0) sel.splice(at, 1); else sel.push(k2); renderQ(); return; }
  if(d.mmap !== undefined){ if(G.qs.done) return; const sel = mqSel(G.q), r = Number(d.mmap), v = Number(d.v); sel[r] = sel[r] === v ? -1 : v; renderQ(); return; }
  if(d.msub){ mqSubmit(ev); return; }
  if(d.mclr){ G.qs.msel = null; renderQ(); return; }
  if(d.next){ finishQuizQ(); return; }
  if(d.askmore){ if(!G || G.done) return; G.asking = true; nextQ(); $("qp").classList.add("on"); hud(); return; }
  if(d.playon){ closeAsk(); return; }
  const a = d.act; if(!a) return;
  if(a === "pause") pauseGame();
  else if(a === "resume"){ closeModal(); if(G){ G.paused = false; lastT = performance.now(); } }
  else if(a === "quit" || a === "tolevels") quitLevel();
  else if(a === "retry"){ const cid = G.cid; startLevel(cid); }
  else if(a === "ask"){ if(G && G.phase === "wave" && !G.done) openAsk(); }
  else if(a === "gowave"){ if(G && G.phase === "prep" && !G.done) startWave(); }
  else if(a === "story"){ const v = ($("storyIn").value || "").trim(); if(v.length < 4){ toast("多寫幾個字喔 ✏️"); return; } kid().story.push({d:today(), cid:G.cid, t:v}); save(); gainTrait("story", "把學到的事寫下來"); b.disabled = true; b.textContent = "✅ 已送出"; }
  else if(a === "help") modal(helpHTML() + `<div class="trow"><button class="pbtn sun" data-act="${G && !G.done ? "resume" : "close"}">知道了！</button></div>`);
  else if(a === "close") closeModal();
  else if(a === "settings") renderSettings();
  else if(a === "tg"){ SV.set[d.k] = !SV.set[d.k]; save(); renderSettings(); }
});
document.addEventListener("visibilitychange", () => { if(document.hidden && G && !G.done && !G.paused) pauseGame(); });

/* ---------- 啟動 ---------- */
buildSprites();
go("title");
// 測試用掛勾（不含任何答案）
window.__garden = {get G(){ return G; }, get SV(){ return SV; }, startLevel, startWave, startQuiz, beginPrep, openAsk, closeAsk, fieldFrozen, fitCanvas, spawnMon, placePlant, nextQ, renderQ, version:GARDEN_VERSION};
</script>
</body>
</html>
