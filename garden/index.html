<style>/* 學習地圖（兩個遊戲共用）— 全部用 sm- 前綴，不影響原本畫面 */
#sm-ov{position:fixed;inset:0;z-index:9000;background:#1f3b2a;color:#1d2433;display:none;flex-direction:column;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
#sm-ov.on{display:flex}
#sm-ov *{box-sizing:border-box}
#sm-ov button{font:inherit;cursor:pointer;touch-action:manipulation}
.sm-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;background:#163020;color:#fff;border-bottom:4px solid #0b1a10}
.sm-top h2{margin:0;font-size:22px;flex:1 1 auto;min-width:140px}
.sm-btn{border:3px solid #2a2a3a;background:#fff;padding:8px 14px;font-weight:800;font-size:18px;box-shadow:3px 3px 0 #2a2a3a;color:#1d2433}
.sm-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #2a2a3a}
.sm-btn.sun{background:#ffd23f}.sm-btn.mint{background:#7ee2a8}.sm-btn.sky{background:#7fd6ff}.sm-btn.pink{background:#ff9fb5}.sm-btn.gray{background:#d9dde5}
.sm-btn:disabled{opacity:.45}
.sm-chip{background:#fffaf0;color:#1d2433;border:3px solid #2a2a3a;padding:3px 9px;font-weight:800;font-size:16px}
.sm-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;background:#24452f}
.sm-tabs button{border:3px solid #2a2a3a;background:#fffaf0;padding:7px 12px;font-weight:800;font-size:17px;color:#1d2433}
.sm-tabs button.on{background:#ffd23f}
.sm-body{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 40px}
.sm-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.sm-unit{background:#fffaf0;border:4px solid #2a2a3a;box-shadow:5px 5px 0 rgba(0,0,0,.35);padding:12px;text-align:left;position:relative;color:#1d2433}
.sm-unit h3{margin:4px 0;font-size:20px;line-height:1.3}
.sm-unit small{display:block;color:#5b6475;font-size:14px;line-height:1.4}
.sm-unit .wk{display:inline-block;background:#7fd6ff;border:2px solid #2a2a3a;padding:0 6px;font-weight:800;font-size:14px}
.sm-unit .st{position:absolute;right:10px;top:8px;color:#e0a000;font-size:18px;letter-spacing:1px}
.sm-unit.lock{opacity:.6;filter:grayscale(.7)}
.sm-unit.lock .wk{background:#d9dde5}
.sm-unit.now{outline:5px solid #ffd23f;outline-offset:2px}
.sm-unit.rev{background:#e9f6ee;border-style:dashed;box-shadow:none}
.sm-panel{max-width:860px;margin:0 auto;background:#fffaf0;border:4px solid #2a2a3a;box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:14px 16px 18px}
.sm-panel h3{margin:4px 0 8px;font-size:22px}
.sm-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.sm-point{background:#fff;border:3px solid #2a2a3a;padding:16px;font-size:20px;line-height:1.6;min-height:120px;font-weight:700}
.sm-dots{display:flex;gap:6px;justify-content:center;margin:8px 0}.sm-dots i{width:12px;height:12px;border:2px solid #2a2a3a;background:#fff;display:block}.sm-dots i.on{background:#ffd23f}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sm-card{height:120px;border:4px solid #2a2a3a;background:repeating-linear-gradient(45deg,#2f8f3a 0 10px,#2a7f33 10px 20px);color:#fff;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;box-shadow:3px 3px 0 #2a2a3a;line-height:1.3}
.sm-card.up{background:#fff;color:#1d2433;font-size:17px}
.sm-card.up.term{background:#fff3b0;font-size:22px}
.sm-card.ok{background:#d9f7e3;color:#0b4a28;border-color:#137a43;font-size:16px}
.sm-card.ok.term{font-size:20px}
.sm-card.bad{background:#ffe1e1}
.sm-q{font-size:22px;font-weight:800;line-height:1.5;margin:8px 0 10px}
.sm-opts{display:grid;gap:8px}
.sm-opt{text-align:left;border:3px solid #2a2a3a;background:#fff;padding:12px 12px 12px 52px;font-size:20px;font-weight:700;position:relative;min-height:58px;box-shadow:3px 3px 0 #2a2a3a;color:#1d2433;line-height:1.4}
.sm-opt:before{content:attr(data-l);position:absolute;left:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;line-height:26px;text-align:center;border:3px solid #2a2a3a;background:#ffd23f;font-weight:900}
.sm-opt.ok{background:#d9f7e3;border-color:#137a43}.sm-opt.bad{background:#ffe1e1;text-decoration:line-through}
.sm-fb{margin-top:10px;border:3px solid #2a2a3a;padding:10px 12px;font-size:18px;line-height:1.6}
.sm-fb.good{background:#dcf7e6}.sm-fb.hint{background:#fff6cf}
.sm-tts{border:3px solid #2a2a3a;background:#7fd6ff;font-weight:900;font-size:18px;padding:6px 12px;box-shadow:3px 3px 0 #2a2a3a}
.sm-clocks{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.sm-clocks figure{margin:0;text-align:center;font-weight:800}
.sm-clocks svg{width:170px;height:170px;display:block}
.sm-big .sm-q{font-size:30px;line-height:1.6}
.sm-big .sm-opt{font-size:28px;min-height:72px;padding-left:60px}
.sm-big .sm-point{font-size:26px}
.sm-big .sm-card.up{font-size:22px}.sm-big .sm-card.up.term{font-size:28px}
.sm-big .sm-tts{font-size:24px;padding:8px 16px}
.sm-big .sm-clocks svg{width:210px;height:210px}
.sm-big .sm-unit h3{font-size:24px}
.sm-stars{font-size:46px;text-align:center;letter-spacing:6px}
.sm-note{font-size:15px;color:#5b6475}
@media (max-width:600px){.sm-q{font-size:19px}.sm-opt{font-size:17px}.sm-big .sm-q{font-size:25px}.sm-big .sm-opt{font-size:23px}.sm-grid{grid-template-columns:repeat(3,1fr)}.sm-card{height:96px;font-size:24px}.sm-card.up{font-size:14px}.sm-card.up.term{font-size:17px}.sm-big .sm-card.up{font-size:16px}.sm-big .sm-card.up.term{font-size:20px}}
</style>
<style>/* 家庭登入畫面 */
html.sbf-lock,html.sbf-lock body{overflow:hidden!important}
#sbf-ov{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:16px;
  background:repeating-linear-gradient(45deg,#5cae3c 0 24px,#6fbf4a 24px 48px);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:auto}
#sbf-ov.on{display:flex}
.sbf-card{background:#fffaf0;border:4px solid #1b1b2a;box-shadow:6px 6px 0 #1b1b2a;border-radius:18px;max-width:640px;width:100%;padding:22px 20px;text-align:center;color:#2a2340}
.sbf-card h1{margin:0 0 6px;font-size:clamp(24px,5vw,34px)}
.sbf-sub{margin:0 0 14px;font-size:17px;color:#5b6475;font-weight:700}
.sbf-fams{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.sbf-fam{flex:1 1 230px;max-width:290px;border:4px solid #1b1b2a;border-radius:16px;background:var(--f);box-shadow:4px 4px 0 #1b1b2a;padding:16px 10px;cursor:pointer;color:#1b1b2a;font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}
.sbf-fam:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1b1b2a}
.sbf-fam b{font-size:28px}.sbf-big{font-size:52px;line-height:1}
.sbf-kids{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sbf-kid{background:#fff;border:3px solid var(--k);border-radius:999px;padding:3px 10px;font-weight:800;font-size:15px}
.sbf-dots{display:flex;gap:14px;justify-content:center;margin:8px 0}
.sbf-dots i{width:22px;height:22px;border-radius:50%;border:3px solid #1b1b2a;background:#fff}
.sbf-dots i.on{background:#ffd23f}
.sbf-dots.shake{animation:sbfsh .35s}
@keyframes sbfsh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sbf-err{min-height:1.4em;color:#e5484d;font-weight:800;margin:4px 0 8px}
.sbf-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.sbf-pad button{font:800 30px/1 ui-monospace,monospace;padding:16px 0;border:4px solid #1b1b2a;border-radius:14px;background:#fff;box-shadow:3px 3px 0 #1b1b2a;cursor:pointer;color:#1b1b2a}
.sbf-pad button.ok{background:#7ee2a8}.sbf-pad button.del{background:#ffd6d6}
.sbf-pad button:disabled{opacity:.5}
.sbf-pad button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1b1b2a}
.sbf-link{margin-top:14px;background:none;border:none;font-weight:800;font-size:17px;font-family:inherit;color:#5b6475;text-decoration:underline;cursor:pointer}
.sbf-roles{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
.sbf-roles button{font-weight:800;font-size:22px;font-family:inherit;padding:14px;border:4px solid #1b1b2a;border-left:14px solid var(--k);border-radius:14px;background:#fff;box-shadow:3px 3px 0 #1b1b2a;cursor:pointer;color:#1b1b2a}
</style>
<style>
:root{--ink:#1d2433;--ink2:#5b6475;--bg:#1f3b2a;--pan:#fffaf0;--line:#2a2a3a;--sun:#ffd23f;--ok:#2fb36b;--bad:#e5484d;--sky:#7fd6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overscroll-behavior:none}
body{background:repeating-linear-gradient(45deg,#24452f 0 16px,#20402b 16px 32px)}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.scr{display:none;min-height:100%;}
.scr.on{display:block}
.pbtn{border:4px solid var(--line);background:#fff;border-radius:0;padding:12px 18px;font-weight:800;font-size:20px;box-shadow:4px 4px 0 var(--line);color:var(--ink)}
.pbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.pbtn.sun{background:var(--sun)}.pbtn.mint{background:#7ee2a8}.pbtn.sky{background:var(--sky)}.pbtn.pink{background:#ff9fb5}.pbtn.gray{background:#d9dde5}
.pbtn:disabled{opacity:.45}
.card{background:var(--pan);border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35)}
#scr-title .box{max-width:760px;margin:0 auto;padding:28px 18px;text-align:center}
.logo{background:#fffaf0;border:6px solid var(--line);box-shadow:8px 8px 0 #0006;padding:18px 12px;margin:10px 0 22px}
.logo h1{margin:6px 0;font-size:44px;line-height:1.15;color:#2b6b3a;text-shadow:3px 3px 0 #ffd23f}
.logo p{margin:4px 0;color:var(--ink2);font-size:17px}
#titleArt{width:100%;max-width:560px;image-rendering:pixelated;display:block;margin:8px auto}
.kids{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:10px 0 18px}
.kid{min-width:230px;padding:18px;font-size:24px}
.kid.on{outline:6px solid var(--sun);outline-offset:2px}
.kid small{display:block;font-size:15px;font-weight:600;color:var(--ink2);margin-top:4px}
.trow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
a.back{color:#d8f5e0;font-size:16px;display:inline-block;margin-top:20px}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#163020;color:#fff;border-bottom:4px solid #0b1a10;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h2{margin:0;font-size:22px;flex:1}
.chip{background:#fffaf0;color:var(--ink);border:3px solid var(--line);padding:4px 10px;font-weight:800;font-size:17px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
.tabs button{border:3px solid var(--line);background:#fffaf0;padding:8px 14px;font-weight:800;font-size:17px}
.tabs button.on{background:var(--sun)}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:6px 14px 30px}
.lvl{text-align:left;padding:14px;position:relative}
.lvl h3{margin:2px 0 6px;font-size:21px}
.lvl .u{font-size:17px;color:var(--ink);font-weight:700}
.lvl .meta{font-size:14px;color:var(--ink2);margin-top:6px}
.lvl .st{position:absolute;right:12px;top:10px;font-size:20px;letter-spacing:2px;color:#e0a000}
.subj{display:inline-block;padding:2px 8px;border:2px solid var(--line);font-size:14px;font-weight:800}
#side{display:none}
#scr-game.scr.on{display:flex;flex-direction:column;height:100%;height:100dvh;max-height:100dvh;overflow:hidden;min-height:0}
#game{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;max-width:1200px;margin:0 auto;position:relative;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#play{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 8px;background:#163020;color:#fff;border-bottom:3px solid #0b1a10;position:relative;z-index:9;flex-wrap:wrap}
#hud .hb{border:3px solid var(--line);background:#fffaf0;color:var(--ink);font-weight:900;padding:4px 10px;font-size:19px;white-space:nowrap}
#hud .sunv{background:var(--sun);min-width:96px;text-align:center}
#hud .ask{background:var(--sun);font-size:22px;padding:6px 16px;box-shadow:3px 3px 0 #0006;display:none}
#hud .gowave{background:#7ee2a8;font-size:20px;padding:6px 14px;box-shadow:3px 3px 0 #0006;display:none}
#hud .ask.on,#hud .gowave.on{display:inline-block}
#hud .ask.pulse{animation:askpulse 1.2s ease-in-out infinite}
@keyframes askpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#wavebar{flex:1;height:24px;border:3px solid var(--line);background:#334;position:relative;min-width:80px}
#wavebar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff7a59,#ffd23f)}
#wavebar span{position:absolute;inset:0;text-align:center;font-size:13px;font-weight:900;line-height:18px;color:#fff;text-shadow:1px 1px 0 #000}
#pausetag{display:none;background:#7fd6ff !important}
#pausetag.on{display:inline-block}
#stage{flex:1 1 auto;min-height:0;position:relative;background:#0b1a10;line-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{width:auto;height:auto;max-width:100%;max-height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;flex:0 0 auto}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:#fffaf0;border:5px solid var(--line);box-shadow:6px 6px 0 #0008;padding:12px 22px;font-size:26px;font-weight:900;line-height:1.3;text-align:center;display:none;pointer-events:none;max-width:90%;z-index:3}
#banner.boss{background:#ffdfe6;color:#9b1030}
#seeds{flex:0 0 auto;display:flex;gap:6px;padding:6px;background:#5a3a22;border-top:3px solid #2b1a0e;border-bottom:3px solid #2b1a0e;overflow-x:auto;z-index:2}
.seed{position:relative;flex:0 0 auto;width:94px;border:3px solid var(--line);background:#fff3d6;padding:3px 2px 2px;text-align:center;line-height:1.1;overflow:hidden}
.seed img{width:56px;height:56px;image-rendering:pixelated;display:block;margin:0 auto}
.seed b{display:block;font-size:13px}
.seed .cost{font-size:15px;font-weight:900;color:#7a4b00}
.seed .cdv{position:absolute;left:0;right:0;top:0;background:rgba(20,20,30,.55)}
.seed.sel{background:#ffe066;outline:4px solid #fff;outline-offset:-7px}
.seed.no{filter:grayscale(.8);opacity:.7}
.seed .home{position:absolute;right:2px;top:2px;font-size:12px;background:#ff7a59;color:#fff;padding:0 3px;border:2px solid var(--line)}
.tool{width:74px}
.tool .ic{font-size:34px;line-height:56px;height:56px}
#qp{display:none;position:absolute;inset:0;z-index:8;background:rgba(8,16,10,.84);overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 16px}
#qp.on{display:block}
#qpw{background:var(--pan);border:4px solid var(--line);box-shadow:6px 6px 0 #0006;padding:12px 14px 16px;max-width:720px;margin:0 auto}
.qmode{font-weight:900;font-size:18px;margin:0 0 8px;padding:6px 10px;border:3px solid var(--line);background:#7fd6ff;display:inline-block}
.qh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{border:2px solid var(--line);padding:1px 7px;font-size:14px;font-weight:800;background:#fff}
.tag.hard{background:#ffe066}.tag.fmt{background:#d6f0ff}.tag.stk{background:#ff9f7a}
.qpass{background:#fff;border:3px dashed #8a7a5a;padding:8px 10px;font-size:17px;line-height:1.6;margin:6px 0;max-height:230px;overflow:auto}
.qtbw{overflow-x:auto;margin:6px 0}
.qtb{border-collapse:collapse;font-size:16px;background:#fff}
.qtb th,.qtb td{border:2px solid #555;padding:4px 8px;text-align:center}
.qtb th{background:#e9f6ee}
.qtb caption{font-weight:800;text-align:left;padding:2px 0;font-size:15px}
.qq{font-size:22px;font-weight:800;line-height:1.45;margin:6px 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:3px solid var(--line);background:#fff;padding:12px 12px 12px 50px;font-size:19px;font-weight:700;position:relative;line-height:1.4;min-height:56px;box-shadow:3px 3px 0 var(--line);color:var(--ink)}
.opt:before{content:attr(data-l);position:absolute;left:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;line-height:24px;text-align:center;border:3px solid var(--line);background:var(--sun);font-weight:900}
.opt.bad{background:#ffe1e1;text-decoration:line-through;color:#8a2a2a}
.opt.ok{background:#d9f7e3;border-color:#137a43;color:#0b4a28}
.fb{margin-top:10px;border:3px solid var(--line);padding:10px 12px;font-size:17px;line-height:1.55;display:none}
.fb.hint{display:block;background:#fff6cf}
.fb.good{display:block;background:#dcf7e6}
.fb b{font-size:18px}
.nextrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.nextrow .pbtn{font-size:18px;padding:9px 16px}
.autobar{flex:1;height:10px;background:#ddd;border:2px solid var(--line);position:relative}
.autobar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);width:0}
.mnote{font-size:15px;color:var(--ink2);margin:4px 0}
.mitems{display:grid;gap:6px}
.mi{text-align:left;border:3px solid var(--line);background:#fff;padding:10px 10px 10px 46px;font-size:18px;font-weight:700;position:relative;min-height:50px;color:var(--ink)}
.mi .bx{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:3px solid var(--line);background:#fff;line-height:22px;text-align:center;font-weight:900}
.mi.on{background:#fff3b0}.mi.on .bx{background:var(--sun)}
.mi.ok{background:#d9f7e3}.mi.bad{background:#ffe1e1}
.mrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:2px dashed #ccc;padding:6px 0}
.mrow b{flex:1 1 180px;font-size:17px}
.mc{border:3px solid var(--line);background:#fff;min-width:46px;height:44px;font-weight:900;font-size:18px;color:var(--ink)}
.mc.on{background:var(--sun)}
.mlegend{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.mlegend span{border:2px solid #777;padding:1px 6px;font-size:14px;background:#fff}
.mseq{font-size:16px;font-weight:700}
.mact{display:flex;gap:8px;margin-top:8px}
.mact .pbtn{font-size:18px;padding:9px 16px}
.fly{position:fixed;z-index:50;font-weight:900;font-size:28px;color:#ffb000;text-shadow:2px 2px 0 #000;pointer-events:none;transition:transform 1s ease-out,opacity 1s}

<script>/* ===== 雙寶家庭登入（冒險隊／花園保衛戰共用）v9 =====
   兩個家庭：咪萌家、奶哥家。家庭密碼不存明碼：只放「加鹽 PBKDF2 雜湊」用來檢查，
   雲端家庭資料夾的代碼也是從密碼算出來的（不知道密碼就找不到另一家的資料）。
   登入記在這台平板（localStorage「shuangbao-device」），兩個遊戲共用。 */
(function(){
"use strict";
const DEVICE_KEY = "shuangbao-device";
const ITER = 150000;
const CODE_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const ARENA = "ARENASHUANGBAOPUBLIC2026";   // 跨家庭連線房間（只放對戰資料，不放家庭進度）
const FAMS = {
  mimeng:{id:"mimeng", name:"咪萌家", emo:"🐱", color:"#ff7eb6", verify:{"salt": "11c260b0694bc7f5b267c14b2a4e9c78", "hash": "126879b9d06fe2fb564968f859d43e69ba070d1d154336fd36a14d55540f8f95"},
    kids:[{slot:"g6", g:"g6", label:"小六", who:"姊姊", sex:"girl", emo:"🔴", color:"#FF4B55"},
          {slot:"g4", g:"g4", label:"小四", who:"弟弟", sex:"boy",  emo:"🔵", color:"#2F9BFF"}]},
  naige:{id:"naige", name:"奶哥家", emo:"🐮", color:"#ffb347", verify:{"salt": "0643110d761d639c76ac089af85e48e9", "hash": "6683e66a77102ceb494833b890e52cb005873bbdce203f6d416cda3e88fcc1a8"},
    kids:[{slot:"g4", g:"g4", label:"小四", who:"姊姊", sex:"girl", emo:"🟠", color:"#FF9F1C"},
          {slot:"g6", g:"g2", label:"小二", who:"弟弟", sex:"boy",  emo:"🟢", color:"#22C08A"}]}
};
function dev(){ try{ return JSON.parse(localStorage.getItem(DEVICE_KEY) || "{}") || {}; }catch(e){ return {}; } }
function saveDev(d){ try{ localStorage.setItem(DEVICE_KEY, JSON.stringify(d)); }catch(e){} }
function current(){
  const d = dev(), F = FAMS[d.fam];
  if(!F || !d.family) return null;
  return Object.assign({}, F, {family:d.family, role:d.role || "both"});
}
const kidOfSlot = (famId, slot) => (FAMS[famId] || FAMS.mimeng).kids.find(k => k.slot === slot) || null;
const kidOfGrade = (famId, g) => (FAMS[famId] || FAMS.mimeng).kids.find(k => k.g === g) || null;
const hex = b => Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, "0")).join("");
async function pbkdf2(pw, salt, nbytes){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:enc.encode(salt), iterations:ITER}, key, nbytes * 8);
}
async function verify(famId, pw){
  const F = FAMS[famId]; if(!F || !/^\d{4,8}$/.test(pw)) return false;
  return hex(await pbkdf2(pw, `sbfam-v1|verify|${famId}|${F.verify.salt}`, 32)) === F.verify.hash;
}
async function familyCode(famId, pw){
  const b = new Uint8Array(await pbkdf2(pw, `sbfam-v1|family|${famId}`, 24));
  return Array.from(b, x => CODE_ABC[x % 32]).join("");
}
/* ---------- 畫面 ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let OV = null, ST = null;
function ov(){
  if(OV) return OV;
  OV = document.createElement("div"); OV.id = "sbf-ov"; document.body.appendChild(OV);
  OV.addEventListener("click", onClick);
  document.addEventListener("keydown", ev => { if(!OV.classList.contains("on") || !ST || ST.step !== "pw") return;
    if(/^\d$/.test(ev.key)) key(ev.key); else if(ev.key === "Backspace") key("del"); else if(ev.key === "Enter") key("ok"); });
  return OV;
}
function showLogin(opts){
  ST = {step:"fam", fam:null, pw:"", err:"", busy:false, fails:0, lockUntil:0, opts:opts || {}};
  ov().classList.add("on"); document.documentElement.classList.add("sbf-lock"); render();
}
function hide(){ if(OV) OV.classList.remove("on"); document.documentElement.classList.remove("sbf-lock"); }
function kidChips(F){ return F.kids.map(k => `<span class="sbf-kid" style="--k:${k.color}">${k.emo} ${k.label}${k.sex === "girl" ? "女生" : "男生"}</span>`).join(""); }
function render(){
  const s = ST; let h = "";
  if(s.step === "fam"){
    h = `<h1>🏡 你是哪一家？</h1><p class="sbf-sub">選自己的家庭，再輸入家庭密碼。登入一次，這台平板會記住。</p>
      <div class="sbf-fams">${Object.values(FAMS).map(F => `<button class="sbf-fam" data-sbf-fam="${F.id}" style="--f:${F.color}"><span class="sbf-big">${F.emo}</span><b>${F.name}</b><span class="sbf-kids">${kidChips(F)}</span></button>`).join("")}</div>
      ${s.opts.cancel ? `<button class="sbf-link" data-sbf="cancel">取消</button>` : ""}`;
  }else if(s.step === "pw"){
    const F = FAMS[s.fam], locked = Date.now() < s.lockUntil;
    h = `<h1>${F.emo} ${F.name}</h1><p class="sbf-sub">請輸入家庭密碼（${s.opts.title ? esc(s.opts.title) : "5 碼數字"}）</p>
      <div class="sbf-dots ${s.err ? "shake" : ""}">${[0,1,2,3,4].map(i => `<i class="${i < s.pw.length ? "on" : ""}"></i>`).join("")}</div>
      <p class="sbf-err">${s.busy ? "⏳ 檢查中⋯" : esc(s.err)}</p>
      <div class="sbf-pad">${["1","2","3","4","5","6","7","8","9","del","0","ok"].map(k => `<button data-sbf-key="${k}" ${s.busy || locked ? "disabled" : ""} class="${k === "ok" ? "ok" : k === "del" ? "del" : ""}">${k === "del" ? "⌫" : k === "ok" ? "✓" : k}</button>`).join("")}</div>
      <button class="sbf-link" data-sbf="back">← ${s.opts.fixedFam ? "取消" : "換一個家庭"}</button>`;
  }else if(s.step === "role"){
    const F = FAMS[s.fam];
    h = `<h1>✅ 歡迎 ${F.emo} ${F.name}！</h1><p class="sbf-sub">這台平板是誰的？（之後可以在「存檔 → 家庭」改）</p>
      <div class="sbf-roles">${F.kids.map(k => `<button data-sbf-role="${k.slot}" style="--k:${k.color}">${k.emo} ${k.label} ${k.who}</button>`).join("")}<button data-sbf-role="both" style="--k:#9b6bff">👫 兩個人共用</button></div>`;
  }
  ov().innerHTML = `<div class="sbf-card">${h}</div>`;
}
function key(k){
  const s = ST; if(s.busy || Date.now() < s.lockUntil) return;
  if(k === "del"){ s.pw = s.pw.slice(0, -1); s.err = ""; render(); return; }
  if(k === "ok"){ submit(); return; }
  if(s.pw.length >= 5) return; s.pw += k; s.err = ""; render();
  if(s.pw.length === 5) setTimeout(submit, 120);
}
async function submit(){
  const s = ST; if(s.busy || s.pw.length < 4) return;
  s.busy = true; render();
  const ok = await verify(s.fam, s.pw).catch(() => false);
  s.busy = false;
  if(!ok){ s.fails++; s.pw = ""; s.err = "密碼不對，再試一次"; if(s.fails >= 5){ s.lockUntil = Date.now() + 30000; s.err = "錯太多次了，30 秒後再試"; setTimeout(render, 30500); } render(); return; }
  if(s.opts.onVerified){ const cb = s.opts.onVerified; hide(); cb(true); return; }   // 只是確認密碼（例如切換家庭前）
  const code = await familyCode(s.fam, s.pw); s.pw = "";
  const d = dev(), was = d.fam;
  if(d.family && d.family !== code && !d.oldFamily) d.oldFamily = d.family;   // 舊的 24 碼家庭碼留著備查（不刪雲端資料）
  d.fam = s.fam; d.family = code; d.famPending = "login"; d.famLoginAt = Date.now();
  if(was !== s.fam) d.role = "both";
  saveDev(d); s.step = "role"; render();
}
function onClick(ev){
  const b = ev.target.closest("button"); if(!b || b.disabled) return; const d = b.dataset;
  if(d.sbfFam){ ST.fam = d.sbfFam; ST.step = "pw"; ST.pw = ""; ST.err = ""; render(); return; }
  if(d.sbfKey){ key(d.sbfKey); return; }
  if(d.sbf === "back"){ if(ST.opts.fixedFam){ const cb = ST.opts.onVerified; hide(); if(cb) cb(false); return; } ST.step = "fam"; ST.err = ""; render(); return; }
  if(d.sbf === "cancel"){ hide(); return; }
  if(d.sbfRole){ const x = dev(); x.role = d.sbfRole; saveDev(x); hide(); const cb = ST.opts.onDone; if(cb) cb(current()); else location.reload(); return; }
}
/* 確認目前家庭的密碼（切換家庭、登出用） */
function askPassword(title){
  const cur = current();
  return new Promise(res => { ST = {step:"pw", fam:cur ? cur.id : "mimeng", pw:"", err:"", busy:false, fails:0, lockUntil:0, opts:{fixedFam:true, title, onVerified:res}}; ov().classList.add("on"); document.documentElement.classList.add("sbf-lock"); render(); });
}
function logout(){ const d = dev(); delete d.fam; d.family = null; d.famPending = null; d.role = "both"; saveDev(d); location.reload(); }
async function switchFamily(){ if(await askPassword("切換家庭前，先輸入目前家庭的密碼")) logout(); }
/* 連線用 Firebase（花園用；冒險隊有自己的） */
let _fb = null;
function fb(){
  if(_fb) return _fb;
  _fb = (async () => {
    const base = "https://www.gstatic.com/firebasejs/12.6.0/";
    const [A, AU, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    const cfg = {apiKey:"AIzaSyD77lL-1ASFc83G8WBaCsvzxaC98i70nR8", authDomain:"shuangbao-family.firebaseapp.com", projectId:"shuangbao-family",
      storageBucket:"shuangbao-family.firebasestorage.app", messagingSenderId:"839995253612", appId:"1:839995253612:web:9d2122c7d6e4afcb834949"};
    const app = A.getApps().find(a => a.name === "sbnet") || A.initializeApp(cfg, "sbnet");

const CURRIC = /*__CURRIC__*/{"g2":[{"key":"chi","name":"國語","pub":"翰林","units":[{"uid":"g2-chi-1","no":1,"name":"第一課 我的心情","full":"第一課 我的心情","group":"第壹單元 心情萬花筒","wk":[1,1],"points":["課名：我的心情（第壹單元「心情萬花筒」）","主題大意：心情和天氣很像，會一下晴天、一下下雨。學著說出自己現在是什麼心情。","句型或修辭重點：用「天氣」來比喻「心情」；練習照課本句型寫下自己的心情。","認字方法：把字分成「左右組合」和「不是左右組合」，學會說「某字旁、某字邊」。"],"keys":[["心情","心裡的感覺，例如開心、難過。"],["字旁（ㄆㄤˊ）","左右組合的字，左邊那一半。"],["字邊","左右組合的字，右邊那一半。"]],"n":8},{"uid":"g2-chi-2","no":2,"name":"第二課 彩色的天空","full":"第二課 彩色的天空","group":"第壹單元 心情萬花筒","wk":[2,2],"points":["課名：彩色的天空","主題大意：剛升上新年級、到新教室時，心裡會緊張；有人陪在身邊，就比較安心。","句型或修辭重點：用「做了什麼事」來表現「心情」（例如高興得跳起來）。","認字方法：「聲音就在國字裡」──有些字裡藏著一個部件，告訴你這個字怎麼念；認識「同音不同字」。"],"keys":[["緊張（ㄐㄧㄣˇ ㄓㄤ）","心裡怕怕的、放不下。"],["安心","心裡覺得很放心、不害怕。"],["同音異字","念起來一樣，寫法和意思不一樣的字。"]],"n":8},{"uid":"g2-chi-3","no":3,"name":"第三課 國王做新衣","full":"第三課 國王做新衣","group":"第壹單元 心情萬花筒","wk":[3,3],"points":["課名：國王做新衣（改編自經典童話）","主題大意：故事裡的國王心情一直變，因為發生的事情會影響心情。我們也想一想：怎麼做能讓自己快樂起來？","句型或修辭重點：用「起因、經過、結果」把故事說完整。","認字方法：「扣掉聲音是部首」──字裡拿掉聲音部件，剩下的常常是部首，和意思有關。"],"keys":[["起因","事情發生的原因，故事的開頭。"],["經過","事情中間怎麼發展。"],["結果","事情最後怎麼樣了。"],["部首（ㄅㄨˋ ㄕㄡˇ）","字裡和意思有關的那一部分，查字典會用到。"]],"n":8},{"uid":"g2-chi-4","no":4,"name":"統整活動一","full":"統整活動一","group":"第壹單元 心情萬花筒","wk":[4,4],"points":["主題大意：聽說話的語氣，猜出對方的心情；認識更多心情語詞；學會用注音查字典。","句型或修辭重點：看情況選對心情語詞，把心情說清楚。","查字典：只知道字怎麼念、不知道怎麼寫時，可以用「注音查字法」。課本用「機」字來練習。"],"keys":[["語氣","說話的聲音大小、快慢，會透露心情。"],["注音查字法","照注音符號的順序在字典裡找字。"]],"n":8},{"uid":"g2-chi-5","no":5,"name":"第四課 水草下的呱呱","full":"第四課 水草下的呱呱","group":"第貳單元 觀察樂趣多","wk":[5,5],"points":["課名：水草下的呱呱","主題大意：用眼睛、耳朵這些感官去觀察大自然，發現青蛙等小動物的有趣地方。","句型或修辭重點：模仿聲音的「摹聲詞」（像呱呱）；用「嗎、呢」問問題的疑問句。","認字方法：學會說「某字頭、某字底」。"],"keys":[["摹聲詞（ㄇㄛˊ ㄕㄥ ㄘˊ）","模仿聲音的詞，例如呱呱、汪汪。"],["疑問句","問問題的句子，最後加問號「？」。"],["字頭、字底","上下組合的字，上面叫字頭，下面叫字底。"]],"n":8},{"uid":"g2-chi-6","no":6,"name":"第五課 沙灘上的畫","full":"第五課 沙灘上的畫","group":"第貳單元 觀察樂趣多","wk":[6,6],"points":["課名：沙灘上的畫","主題大意：和家人到海邊，在沙灘上留下的腳印，看起來就像一幅畫。仔細觀察，就能發現大自然的美。","句型或修辭重點：加上「形容詞」讓句子更生動；把一件事說完整（誰、在哪裡、做什麼）。","認字方法：複習「聲音就在國字裡」。"],"keys":[["形容詞","說明東西樣子的詞，例如藍藍的、美麗的。"],["沙灘（ㄕㄚ ㄊㄢ）","海邊有很多沙子的地方。"]],"n":8},{"uid":"g2-chi-7","no":7,"name":"第六課 草叢裡的星星","full":"第六課 草叢裡的星星","group":"第貳單元 觀察樂趣多","wk":[7,7],"points":["課名：草叢裡的星星","主題大意：晚上和家人到戶外，看見草叢裡一閃一閃的亮光，像天上的星星。課程計畫用螢火蟲的知識來補充。","句型或修辭重點：把看到的東西想像成別的東西（亮光像星星）；練習不同的描寫句子；把路線說清楚。","認字方法：相同部件、不同部首的「相似字」。"],"keys":[["草叢（ㄘㄨㄥˊ）","長得很密的一大片草。"],["螢火蟲（ㄧㄥˊ ㄏㄨㄛˇ ㄔㄨㄥˊ）","身體會發光的小昆蟲。"],["相似字","長得很像、容易寫錯的字。"]],"n":8},{"uid":"g2-chi-8","no":8,"name":"統整活動二","full":"統整活動二","group":"第貳單元 觀察樂趣多","wk":[8,8],"points":["主題大意：學寫日記；用不同感官觀察大自然；用「起因、經過、結果」把故事說清楚。","句型或修辭重點：寫日記可以想「地點、人、事、感覺」；說故事要有「人、事、時、地、物」。"],"keys":[["日記","把每天特別的事和感覺記下來。"],["感官","眼睛、耳朵、鼻子、舌頭、皮膚，用來感受世界。"]],"n":8},{"uid":"g2-chi-9","no":9,"name":"來閱讀一：小蜻蜓低低飛","full":"來閱讀一：小蜻蜓低低飛","group":"第貳單元 觀察樂趣多","wk":[9,9],"points":["課名：小蜻蜓低低飛","主題大意：從小動物的樣子去猜天氣，練習仔細觀察和推想。","閱讀方法：看插圖、看前後句子找答案；用已經知道的線索推想後面的事。"],"keys":[["蜻蜓（ㄑㄧㄥ ㄊㄧㄥˊ）","有兩對透明翅膀、很會飛的昆蟲。"],["推論","從線索想出答案。"]],"n":8},{"uid":"g2-chi-10","no":10,"name":"第七課 不一樣的美食","full":"第七課 不一樣的美食","group":"第參單元 美食點點名","wk":[11,11],"points":["課名：不一樣的美食（第參單元「美食點點名」）","主題大意：有些食物背後有節日和文化的意思；不同國家的人吃的東西不一樣，要互相尊重。","句型或修辭重點：用學過的句型介紹自己喜歡的東西。","認字方法：常一起出現的部件；一個字有不只一種讀音（一字多音）。"],"keys":[["節慶","節日，例如端午節、中秋節。"],["文化","一群人共同的生活習慣和想法。"],["一字多音","同一個字，在不同語詞裡念法不同。"]],"n":7},{"uid":"g2-chi-11","no":11,"name":"第八課 美食分享日","full":"第八課 美食分享日","group":"第參單元 美食點點名","wk":[12,12],"points":["課名：美食分享日","主題大意：在教室裡分享美食，大家一起認識、動手做春捲（潤餅捲）這類食物。","句型或修辭重點：依照情境寫出完整的句子；用「起因、經過、結果」重述故事。","認字方法：「部件好朋友」──「木」可以當部首，也可以只是字裡的一個部件。"],"keys":[["分享","把好東西給別人一起用、一起吃。"],["部件","組成一個字的小零件。"]],"n":8},{"uid":"g2-chi-12","no":12,"name":"第九課 好味道","full":"第九課 好味道","group":"第參單元 美食點點名","wk":[13,13],"points":["課名：好味道","主題大意：全家一起洗菜、煮飯、包壽司，家人做的食物裡有滿滿的愛。","句型或修辭重點：用「疊字形容詞」讓人更容易感受食物的樣子；認識「哇、啊」這類感嘆詞。","認字方法：「部首有意思」──部首能告訴我們字和什麼有關；多音字。"],"keys":[["疊字","兩個一樣的字放在一起，例如香香的。"],["感嘆詞","表達驚訝、開心的詞，例如「哇」。"],["驚嘆號","「！」，放在表示驚訝或很激動的句子後面。"]],"n":8},{"uid":"g2-chi-13","no":13,"name":"統整活動三","full":"統整活動三","group":"第參單元 美食點點名","wk":[14,14],"points":["主題大意：聊臺灣小吃；看圖用「一開始、接著、最後」說出事情的順序；學會用部首查字典。","查字典：遇到不會念的字，可以用「部首查字法」：先找部首，再數部首以外的筆畫。"],"keys":[["順序","事情先後的次序。"],["部首查字法","先找部首，再數剩下的筆畫來找字。"]],"n":8},{"uid":"g2-chi-14","no":14,"name":"第十課 加加減減","full":"第十課 加加減減","group":"第肆單元 語文真有趣","wk":[15,15],"points":["課名：加加減減（第肆單元「語文真有趣」）","主題大意：用加上、減去部件的方法猜字謎；主角從猜錯到猜對，心情跟著變化。","句型或修辭重點：「轉折句」，用「可是、但是」表示事情轉了個彎。","認字方法：部首的意思；同音異字。"],"keys":[["字謎（ㄇㄧˊ）","用字的部件出題，讓人猜是哪個字。"],["轉折","話說到一半，意思轉向另一邊。"]],"n":8},{"uid":"g2-chi-15","no":15,"name":"第十一課 奇怪的門","full":"第十一課 奇怪的門","group":"第肆單元 語文真有趣","wk":[16,16],"points":["課名：奇怪的門","主題大意：課文用「門」和其他部件組成新字，編成一個好玩的故事。","句型或修辭重點：接著說故事，把起因、經過、結果說完整；想想故事還能有什麼不同的結局。","認字方法：「部首會變形」──部首換了位置，寫法可能會變，有時還藏在字中間。"],"keys":[["組字","用部件拼成新的字。"],["部首變形","例如「水」在左邊寫成「氵」。"]],"n":8},{"uid":"g2-chi-16","no":16,"name":"第十二課 詠鵝","full":"第十二課 詠鵝","group":"第肆單元 語文真有趣","wk":[17,17],"points":["課名：詠鵝（和唐詩〈詠鵝〉有關，作者是唐朝的駱賓王）","主題大意：在河邊觀察白鵝的樣子和叫聲，感受古詩描寫動物的趣味。","句型或修辭重點：用連接詞把句子接起來；換用意思相近的詞寫讚美的句子；仿照詩句描寫動物。","認字方法：找出左右、上下組合字的部首；「讀起來不一樣」的多音字。"],"keys":[["詠（ㄩㄥˇ）","用詩或歌來讚美。"],["鵝（ㄜˊ）","脖子長長、會游水的大型水鳥。"],["相似詞","意思差不多的詞，例如美麗和漂亮。"]],"n":8},{"uid":"g2-chi-17","no":17,"name":"統整活動四","full":"統整活動四","group":"第肆單元 語文真有趣","wk":[18,18],"points":["主題大意：描述喜歡的動物；認識專名號和書名號；認識圖書館各區和使用規則。","標點重點：專名號用在人名、地名等名字；書名號用在書名、文章名。"],"keys":[["專名號","標在人名、地名旁邊的直線。"],["書名號","標書名的符號，可以寫成《 》或波浪線。"],["圖書館","可以借書、看書的地方。"]],"n":8},{"uid":"g2-chi-18","no":18,"name":"來閱讀二：不簡單的字","full":"來閱讀二：不簡單的字","group":"第肆單元 語文真有趣","wk":[19,19],"points":["課名：不簡單的字","主題大意：國字有很多有趣的地方；遇到不懂的字，可以查字典或問大人。","閱讀方法：查字典找答案；看題目猜文章內容。","語詞重點：體會四字語詞的趣味，用四字語詞把意思說清楚。"],"keys":[["四字語詞","由四個字組成、常常一起用的詞。"],["預測","讀之前先猜猜看會寫什麼。"]],"n":8}],"review":[{"name":"複習週一（第壹、貳單元）","label":"複習","wk":[10,10]},{"name":"複習週二（第參、肆單元）","label":"複習","wk":[20,20]},{"name":"總複習","label":"複習","wk":[21,21]}]},{"key":"math","name":"數學","pub":"南一","units":[{"uid":"g2-math-1","no":1,"name":"數到 300","full":"數到 300","group":"第 1 單元","wk":[1,2],"points":["1 個 1 個數、10 個 10 個數，一路數到 300；也會倒著數回來。","認識「百位」：100 個一和 1 個百一樣多。","會把數拆成幾個百、幾個十、幾個一（位值換算）。","比較兩個數誰大誰小，會用「＞」和「＜」。"],"keys":[["百位","從右邊數來第三位，代表有幾個「一百」。"],["定位板","分成百位、十位、個位的表格，幫我們看清楚每一位。"],["＞（大於）、＜（小於）","開口朝向比較大的數。"]],"n":11},{"uid":"g2-math-2","no":2,"name":"二位數的加減","full":"二位數的加減","group":"第 2 單元","wk":[3,4],"points":["用直式算加法，從個位開始算；個位滿 10 要「進位」到十位。","會算連續進位的加法（答案可以超過 100，最多到 200 以內）。","用直式算減法；個位不夠減時，要向十位「借 1」（退位）。","把生活中的問題寫成加法或減法算出來。"],"keys":[["直式","把數字上下對齊來算的寫法。"],["進位","個位加起來滿 10，送 1 個十到十位。"],["退位","個位不夠減，從十位拿 1 個十來換成 10 個一。"]],"n":12},{"uid":"g2-math-3","no":3,"name":"幾公分","full":"幾公分","group":"第 3 單元","wk":[5,6],"points":["用迴紋針、橡皮擦這類東西量長度，東西大小不同，量到的數字也會不同。","認識 1 公分，用公分當單位來量長度。","會用公分尺量東西，也會用「斷尺」（不是從 0 開始的尺）量。","會估計長度、畫出指定長度的線，也會算長度的加減。"],"keys":[["公分","量長度的單位，尺上從 0 到 1 的長度就是 1 公分。"],["斷尺","斷掉一截的尺，量的時候要用「後面的數減前面的數」。"],["估測","還沒量之前，先猜大約多長。"]],"n":10},{"uid":"g2-math-4","no":4,"name":"加減的關係與應用","full":"加減的關係與應用","group":"第 4 單元","wk":[7,8],"points":["加法和減法是一對好朋友，可以互相「倒回去」（加減互逆）。","用這個關係找出算式裡不知道的數（□）。","算完減法，用加法檢查答案對不對（驗算）。","會用「＞、＜、＝」比較兩個算式的大小。"],"keys":[["加減互逆","25＋17＝42，倒回去就是 42－17＝25。"],["驗算（ㄧㄢˋ ㄙㄨㄢˋ）","算完之後再檢查一次。"],["＝（等於）","兩邊一樣多。"]],"n":10},{"uid":"g2-math-5","no":5,"name":"容量","full":"容量","group":"第 5 單元","wk":[9,9],"points":["認識可以裝水的「容器」，知道容器裝滿時能裝多少水叫「容量」。","兩個大小差很多的容器，可以直接看、直接比。","差不多大的容器，用同一個小杯子去裝、數杯數來比（間接比較、個別單位）。","水倒到不同形狀的瓶子，看起來高度不同，水量其實沒有變。"],"keys":[["容器","可以裝東西的器具，例如杯子、水壺。"],["容量（ㄖㄨㄥˊ ㄌㄧㄤˋ）","容器裝滿時能裝多少。"],["液量","容器裡現在裝了多少水。"]],"n":9},{"uid":"g2-math-6","no":6,"name":"兩步驟的加減","full":"兩步驟的加減","group":"第 6 單元","wk":[11,12],"points":["三個數連加：先算兩個，再加第三個。","三個數連減：一次減一個，分兩步算。","有加也有減的問題，照順序一步一步算。","連加時可以先挑好算的兩個數湊起來，算得更快（加法的結合律）。"],"keys":[["兩步驟","要算兩次才能得到答案。"],["連加、連減","三個數一直加下去、一直減下去。"]],"n":11},{"uid":"g2-math-7","no":7,"name":"2、5、4、8 的乘法","full":"2、5、4、8 的乘法","group":"第 7 單元","wk":[13,14],"points":["一樣多的東西一直加，可以用「倍」和乘法來算。","認識乘法算式：被乘數 × 乘數 ＝ 積。","會背 2、5、4、8 的乘法口訣（九九乘法）。","用乘法解決生活中的問題。"],"keys":[["倍（ㄅㄟˋ）","「5 的 3 倍」就是 3 個 5 相加。"],["被乘數、乘數、積","在 5×4＝20 裡，5 是被乘數，4 是乘數，20 是積。"],["口訣","方便背的乘法句子，例如「二四得八」。"]],"n":12},{"uid":"g2-math-8","no":8,"name":"幾時幾分","full":"幾時幾分","group":"第 8 單元","wk":[15,16],"points":["認識時針（短針）和分針（長針）。","鐘面上 1 小格是 1 分鐘；1 大格有 5 小格，是 5 分鐘；鐘面一共 12 大格。","看鐘說出「幾時幾分」，也會把鐘撥到指定的時刻。","數一數兩個時刻中間經過多久；知道幾小時或幾分鐘以後是幾時幾分。"],"keys":[["時針","短短的針，告訴我們「幾時」。"],["分針","長長的針，告訴我們「幾分」。"],["經過的時間","從一個時刻到另一個時刻，中間過了多久。"]],"n":11},{"uid":"g2-math-9","no":9,"name":"3、6、7、9 的乘法","full":"3、6、7、9 的乘法","group":"第 9 單元","wk":[17,18],"points":["用同數累加和「倍」的想法，學 3、6、7、9 的乘法。","會背 3、6、7、9 的乘法口訣，九九乘法全部學完。","用乘法解決「幾倍」和「每份一樣多」的生活問題。"],"keys":[["單位量","每一份有多少，例如一包有 9 顆。"],["九九乘法表","從 1×1 到 9×9 的乘法整理表。"]],"n":12},{"uid":"g2-math-10","no":10,"name":"平面圖形","full":"平面圖形","group":"第 10 單元","wk":[19,19],"points":["認識圖形的「邊、角、頂點」。","三角形有 3 個邊、3 個角、3 個頂點；正方形和長方形各有 4 個邊、4 個角、4 個頂點。","正三角形 3 個邊一樣長；正方形 4 個邊一樣長；長方形有 2 雙一樣長的邊。","分辨圖形的內部、外部和周界；把一圈的邊長加起來就是「周長」。"],"keys":[["頂點（ㄉㄧㄥˇ ㄉㄧㄢˇ）","兩個邊碰在一起的尖尖點。"],["周界","圍住圖形的那一圈線。"],["周長（ㄓㄡ ㄔㄤˊ）","周界有多長，也就是所有邊長加起來。"]],"n":11}],"review":[{"name":"評量週（複習單元 1–5）","label":"加油小站一","wk":[10,10]},{"name":"評量週（複習單元 6–10）","label":"加油小站二","wk":[20,20]}]},{"key":"life","name":"生活","pub":"康軒","units":[{"uid":"g2-life-1","no":1,"name":"地震來了不慌張","full":"地震來了不慌張","group":"主題一 防震小達人","wk":[1,1],"points":["地震來的時候，先保護自己的生命。","記住保命三步驟：趴下、掩護、穩住。","躲在堅固的桌子下面，雙膝跪著，手握緊桌腳。","學校疏散演練：聽廣播、排好隊，做到不推、不跑、不喧譁。"],"keys":[["掩護（ㄧㄢˇ ㄏㄨˋ）","把頭和脖子保護好。"],["穩住（ㄨㄣˇ ㄓㄨˋ）","抓好東西，讓身體不要倒。"],["疏散（ㄕㄨ ㄙㄢˋ）","大家有秩序的離開到安全的地方。"]],"n":9},{"uid":"g2-life-2","no":2,"name":"地震應變有方法","full":"地震應變有方法","group":"主題一 防震小達人","wk":[2,2],"points":["在不同地方遇到地震（房間、客廳、走廊、戶外），都要想辦法做到趴下、掩護、穩住。","找身邊堅固的東西或手邊的物品來保護頭頸。","地震時狀況很多，保命最重要；學到的方法要和家人分享。"],"keys":[["應變","遇到突然發生的事，想辦法處理。"],["掩蔽物","可以躲在下面保護自己的堅固東西。"]],"n":8},{"uid":"g2-life-3","no":3,"name":"防震大使 Go！Go！Go！","full":"防震大使 Go！Go！Go！","group":"主題一 防震小達人","wk":[3,3],"points":["自己設計「防震狀況卡」：正面寫地點和狀況（在哪裡、正在做什麼），背面寫遇到地震該怎麼做。","拿狀況卡去考同學、家人，當防震小大使。","地震後可能發生火災：要大喊「失火了！」，往下、往外逃，不搭電梯，不躲浴室。","平時預防火災：不玩火，不用的插頭拔掉，熱的東西遠離紙和衣服。"],"keys":[["宣導","把重要的事情告訴大家。"],["狀況卡","寫著「遇到某種情況」的小卡片，用來考考別人。"]],"n":9},{"uid":"g2-life-4","no":4,"name":"光和影","full":"光和影","group":"主題二 光影好好玩","wk":[4,4],"points":["有光，東西擋住光，就會有影子。","玩踩影子遊戲，想辦法保護自己的影子。","中午的影子比上午、下午短；上午和下午影子的方向不一樣。","東西形狀不同，影子形狀也不同；人一動，影子也跟著動。"],"keys":[["影子（ㄧㄥˇ ˙ㄗ）","光被東西擋住後，留下的暗暗的形狀。"],["光源","會發出光的東西，例如太陽、手電筒。"]],"n":8},{"uid":"g2-life-5","no":5,"name":"光影魔法師","full":"光影魔法師","group":"主題二 光影好好玩","wk":[5,6],"points":["用身體擺出各種動作，變出特別的影子；和同學合作拼出更大的影子造型。","在室內用手電筒、檯燈做手影，用道具組合出有趣的影子。","東西離光源越近，影子越大；離光源越遠，影子越小。","唱〈影子歌〉、玩模仿節奏遊戲。"],"keys":[["手影","用手擺出形狀，在燈光下變出的影子。"],["人造光源","人做出來會發光的東西，例如手電筒。"]],"n":8},{"uid":"g2-life-6","no":6,"name":"光影小故事","full":"光影小故事","group":"主題二 光影好好玩","wk":[7,7],"points":["用身體、手影、紙偶的影子，和同學合作演一個光影小故事。","先想好故事，再決定角色；也可以先有角色再自己編故事。","說臺詞要大聲、清楚；可以讓影子變大變小、加音效。","當個好觀眾，欣賞別人的表演。"],"keys":[["臺詞","演戲時角色要說的話。"],["音效","故事裡的聲音效果，例如敲門聲。"]],"n":8},{"uid":"g2-life-7","no":7,"name":"泡泡在哪裡","full":"泡泡在哪裡","group":"主題三 玩泡泡","wk":[8,9],"points":["想想生活中什麼時候會看到泡泡（洗手、洗碗、洗澡）。","調泡泡水需要：水、容器、會起泡的清潔劑、攪拌的工具。","用吸管、毛根等東西做吹泡泡的工具；洞越多，泡泡越多。","輕輕吹、慢慢吹，泡泡比較不容易破；泡泡在陽光下會變彩色。"],"keys":[["泡泡水","可以吹出泡泡的水。"],["清潔劑","洗碗精、肥皂這類會起泡泡的東西。"],["毛根","外面毛毛、裡面有鐵絲，可以彎成各種形狀。"]],"n":9},{"uid":"g2-life-8","no":8,"name":"泡泡變變變","full":"泡泡變變變","group":"主題三 玩泡泡","wk":[10,10],"points":["用不同方法做出造型泡泡：大泡泡裡吹小泡泡、把泡泡疊起來、小組接力傳泡泡。","幫自己做的特別泡泡取名字。","在泡泡水裡加顏料，把彩色泡泡吹在圖畫紙上，再畫成一幅泡泡聯想畫。"],"keys":[["造型泡泡","用巧思做出特別樣子的泡泡。"],["聯想","看到一樣東西，想到另一樣東西。"]],"n":8},{"uid":"g2-life-9","no":9,"name":"學校附近有什麼","full":"學校附近有什麼","group":"主題四 學校附近","wk":[11,12],"points":["說一說上學路上看過哪些地方、遇過哪些人。","上學放學要注意交通安全：走人行道或騎樓，經過停車場出入口要看警示燈和來車，雨天穿顯眼的衣服或雨衣。","想更認識學校附近，可以問家人、去看看、查書、上網找資料。","出發探訪前先準備，訪問別人要有禮貌。"],"keys":[["公共設施","給大家一起使用的地方或東西，例如公園、圖書館。"],["騎樓（ㄑㄧˊ ㄌㄡˊ）","房子一樓前面有屋頂的走道。"],["關鍵字","上網查資料時輸入的重要詞。"]],"n":10},{"uid":"g2-life-10","no":10,"name":"分享學校附近的故事","full":"分享學校附近的故事","group":"主題四 學校附近","wk":[13,14],"points":["把印象最深刻的地方或人畫下來（用粉蠟筆，可以疊色、混色）。","當「小小播報員」：介紹地點、說怎麼知道的、說自己的感想。","知道各個地方的功能，以及在那裡為大家服務的人。","感謝為我們服務的人。"],"keys":[["播報員","在大家面前報告消息的人。"],["服務","幫助別人、為大家做事。"]],"n":8},{"uid":"g2-life-11","no":11,"name":"溫馨送暖","full":"溫馨送暖","group":"主題五 歲末傳溫情","wk":[15,16],"points":["一年快結束了，大家會做很多事：冬至吃湯圓、互相祝福、送禮物、參加送暖活動。","觀察身邊誰需要被關心，例如受傷的同學、獨居的長輩。","用行動關懷別人：幫忙拿東西、捐舊衣、捐發票、寫卡片。","聽說耶誕老公公的故事，和一位叫尼古拉的人有關。"],"keys":[["歲末（ㄙㄨㄟˋ ㄇㄛˋ）","一年快結束的時候。"],["關懷","關心、照顧別人。"],["獨居","一個人住。"]],"n":8},{"uid":"g2-life-12","no":12,"name":"傳送我的愛","full":"傳送我的愛","group":"主題五 歲末傳溫情","wk":[17,18],"points":["想想怎麼感謝幫助過自己的人：寫卡片、唱歌、幫忙做家事、送自己做的小禮物。","寫祝福前先想三件事：送給誰、寫在哪裡、寫什麼。","動手做耶誕卡和耶誕襪。","唱〈聖誕鈴聲〉，用三角鐵、響板伴奏；體會幫助別人的快樂。"],"keys":[["祝福","希望別人過得好的話。"],["三角鐵","三角形的金屬樂器，用鐵棒敲出聲音。"],["響板","兩片拍在一起會發出「喀喀」聲的樂器。"]],"n":8},{"uid":"g2-life-13","no":13,"name":"五花八門的米食","full":"五花八門的米食","group":"主題六 米粒魔術師","wk":[19,20],"points":["看營養午餐菜單，發現主食大多是米飯。","有些食物看不到米粒，其實也是米做的（例如蘿蔔糕、米漿、爆米香）。","想確定是不是米做的，可以問長輩、問店家、看包裝上的成分標示。","把米製品分類，用五官品嘗米食；用油土、紙材做創意米食。"],"keys":[["主食","每餐主要吃的東西，例如米飯。"],["米製品","用米做成的食物。"],["成分標示","包裝上寫著「用什麼做的」的地方。"]],"n":9},{"uid":"g2-life-14","no":14,"name":"珍惜食物","full":"珍惜食物","group":"主題六 米粒魔術師","wk":[21,21],"points":["知道稻米怎麼長大：先讓穀粒發芽、育苗，再插秧，接著除草、施肥，最後收割、晒穀。","模仿農夫插秧的動作（一邊插一邊往後退），體會農夫的辛苦。","唱、念〈憫農詩〉，感受農夫的辛勞。","珍惜食物：吃多少盛多少，不敢吃的先試一小口。"],"keys":[["插秧（ㄔㄚ ㄧㄤ）","把小小的稻苗一株株種進田裡。"],["收割","把成熟的稻子割下來。"],["憫（ㄇㄧㄣˇ）農","同情、體諒農夫的辛苦。"]],"n":9}],"review":[]}],"g6":[{"key":"chi","name":"國語","pub":"康軒","units":[{"uid":"g6-chi-1","no":1,"name":"擷取品格的珍寶","full":"擷取品格的珍寶（第一課 跑道／第二課 朱子治家格言選／第三課 談遇見更好的自己／學習地圖一）","group":"","wk":[1,5],"points":["文體：記敘文，故事性的寫法（課程計畫的參考書目是少年小說《跑道》）。","主旨大意（推斷）：透過主角在跑道上的經歷，寫出他心情的起伏和轉變，讓讀者體會面對挑戰時的品格與態度。","寫作手法：｜用順敘或倒敘安排事件。順敘是照時間先後寫；倒敘是先寫結果或後面發生的事，再回頭寫前面。｜寫出人物的連續動作和事件細節，讓讀者看見人物的情緒變化。","學習活動：從標題猜課文內容、理解四字詞語、分享自己「心情轉換」的經驗並寫成一段。","文體：古文（格言）。","作者：朱用純，號柏廬，明末清初人。這裡的「朱子」指朱柏廬，和南宋的朱熹是不同人。","主旨大意：用簡短的句子提醒人在日常生活中要勤勞、節儉、整潔、做事先準備，從管好自己到管好一個家。","原著常見名句（課本選錄哪幾句以課本為準）：｜「黎明即起，灑掃庭除」：天一亮就起床，打掃庭院和屋子。｜「一粥一飯，當思來處不易」：每一口飯都要想到得來不容易。｜「宜未雨而綢繆，毋臨渴而掘井」：要在下雨前先修好門窗，不要等到口渴才挖井。","學習活動：用理解古文的策略把格言翻成白話，並想想在生活中怎麼用。","延伸成語：未雨綢繆、臨渴掘井（都出自上面那一句）。","文體：議論文。","主旨大意：說明怎麼做才能讓自己變得更好，並提出具體的方法。","寫作手法：先提出觀點，再用正面例子和反面例子支持觀點；可以用心智圖或表格整理文章重點。","議論文的三個要素：論點（作者的主張）、論據（支持主張的例子或道理）、結論。","格言和諺語的分辨：｜格言：古人或名人留下、勸人向善的話，文字比較文雅。例如《論語》的「學而時習之」。｜諺語：民間口耳相傳的俗話，比較口語好懂。例如「三個臭皮匠，勝過一個諸葛亮」。","搜尋資料：想清楚要輸入哪些關鍵詞；用「5W 思考法」（何人、何事、何時、何地、為何）檢查資料；再把資料整理成摘要筆記。"],"keys":[["記敘文","用敘述事情經過為主的文章。"],["順敘","照事情發生的先後順序寫。"],["倒敘","先寫後面的事或結果，再回頭寫前面的經過。"],["格言","可以當作做人做事準則的簡短名言。"],["諺語","民間流傳、通俗好懂的俗話。"],["議論文","提出觀點並說明理由的文章。"],["論點","作者想說服別人的主張。"],["未雨綢繆","事情發生前先做好準備。"],["臨渴掘井","事到臨頭才想辦法，已經來不及。"],["關鍵詞","搜尋資料時最能代表主題的詞。"]],"n":10},{"uid":"g6-chi-2","no":2,"name":"品嘗美食的滋味","full":"品嘗美食的滋味（第四課 臺灣美食詩選／第五課 最好的味覺禮物／第六課 珍珠奶茶／學習地圖二／閱讀階梯一 野菜，部落不可缺的味）","group":"","wk":[5,10],"points":["文體：詩歌（現代詩）。","主旨大意：用詩介紹臺灣小吃，寫出小吃的樣子、味道和背後的故事（典故）。","寫作手法：｜五感描寫：用看到、聽到、聞到、嘗到、摸到的感覺來寫食物（課程計畫也提到加上心裡感受的「六感」）。｜聯想：從食物聯想到人、事、回憶，再寫成詩句。","學習活動：從詩句推敲典故線索，蒐集資料後自己創作一首童詩。","延伸認識（主題常見，課本是否提到以課本為準）：臺南的擔仔麵，相傳是漁夫在不能出海的淡季挑著擔子賣麵維生，所以招牌常寫「度小月」。","延伸語詞：津津有味、回味無窮、色香味俱全、垂涎三尺。","文體：記敘文。","主旨大意（推斷）：一份食物可以裝著心意，親手做、用心送出的味道，就是最珍貴的禮物；寫出人物心情的轉換。","寫作手法：順敘或倒敘安排事件；寫出對食物的感受和體悟；用摘要策略寫出每段重點和全文大意。","學習活動：分組實作料理並記錄過程，分享心情轉換的經驗。","文體：說明文。","主旨大意：介紹珍珠奶茶的歷史、作法和發展，說明它怎麼從臺灣的飲料變成世界知名的美食代表。","確定的背景知識：珍珠奶茶起源於臺灣，大約在 1980 年代出現；裡面的「珍珠」（粉圓）主要用樹薯粉做成。","寫作手法：說明文常用描述、列舉、因果、比較等方法，讓內容清楚有條理；找出文章結構（歷史 → 作法 → 影響）。","學習活動：為不同國家的美食設計標題，寫一份簡報稿（前言、說明、結語）。","簡報三要素：主題、結構、設計。","簡報稿的架構：前言（引起興趣）→ 說明（重點內容）→ 結語（用一句簡短有力或有創意的話收尾）。","複習詩歌的寫作技巧，練習創作童詩。","文體：散文（帶說明性質）。","主旨大意：野菜是原住民部落餐桌上重要的食物，也是離家的人心中的思鄉味道。","閱讀策略：理解監控——讀到不懂的句子或段落，先停下來，用流程圖一步一步找方法解決（重讀、看上下文、查資料）。","寫作練習：｜找出文中描寫野菜稀飯的五感句子。｜寫步驟時用連接詞：首先、接著、然後、最後。｜至少用兩種感官描寫一種食物。"],"keys":[["詩歌","用精簡、有節奏的句子表達感受的文體。"],["童詩","寫給兒童或兒童寫的詩。"],["五感","視覺、聽覺、嗅覺、味覺、觸覺。"],["聯想","由一件事想到另一件相關的事。"],["典故","詩文或事物背後的來歷、故事。"],["說明文","清楚介紹事物或道理的文章。"],["列舉","一項一項舉出例子。"],["簡報","用投影片或圖表向別人介紹主題。"],["理解監控","閱讀時隨時檢查自己有沒有讀懂。"],["連接詞","把句子或步驟串起來的詞，例如首先、接著、最後。"],["津津有味","吃得很有味道，也可以形容做事或聽故事很有興趣。"],["回味無窮","事後想起來，覺得意味深長、還想再回味。"]],"n":10},{"uid":"g6-chi-3","no":3,"name":"展現思辨的智慧","full":"展現思辨的智慧（第七課 大小剛好的鞋子／第八課 狐假虎威／第九課 空城計／學習地圖三）","group":"","wk":[11,15],"points":["文體：記敘文（生活散文）。","主旨大意：作者從生活中的小事物得到啟發，示範「認真觀察 → 發現問題 → 恰當提問 → 得到收穫」的思考過程。","學習重點：｜用自我提問策略讀文章：邊讀邊問自己問題，再從文中找答案。｜部件識字：找出部件相同的字，整理它們的音和義（例如有「足」部的字多和腳有關）。｜學習作者怎麼從生活小事找到寫作材料。","文體：寓言。原文出自古書《戰國策》。","故事大意（原著）：老虎抓到狐狸，狐狸騙老虎說自己是天帝派來管百獸的，要老虎跟在牠後面看看。百獸看到牠們，全都嚇得逃走，老虎以為大家怕的是狐狸，其實大家怕的是牠自己。","寓意：比喻倚仗別人的權勢來嚇唬人、欺負人。也提醒我們要看清楚事情的真相。","學習活動：朗讀經典原文，體會古文的抑揚頓挫；用成語造句。","文體：歷史小說改寫，故事來自古典小說《三國演義》；課文會對照文言原文閱讀。","故事大意（原著）：諸葛亮守城時兵力很少，司馬懿帶大軍殺來。諸葛亮下令打開城門，讓士兵扮成百姓在城門口掃地，自己坐在城樓上彈琴。司馬懿知道諸葛亮一向謹慎，懷疑城裡有埋伏，就下令撤退。","主旨：在危急時刻沉著冷靜，並看懂對手的心理，就能化解危機。","學習重點：整理段意、歸納大意；分辨不同時代文言文和白話文的差別；朗讀時表現情感。","延伸語詞（主題常見）：從容不迫、臨危不亂、虛張聲勢。","事實和觀點：｜事實：真的發生、可以查證的事。例如「今天下午下雨」。｜觀點：個人的看法或感受。例如「下雨天最讓人心煩」。","尊重別人的觀點，也能針對新聞事件說出自己的觀點。","寓言：用簡短的故事（常用動物當主角）說出一個道理，這個道理叫寓意。課本整理了四個找寓意的方法（細節以課本為準）；可以先問自己：「主角做了什麼？結果怎樣？作者想提醒什麼？」"],"keys":[["自我提問","讀文章時自己問問題、自己找答案。"],["部件","組成國字的一小部分。"],["寓言","用故事說道理的文章。"],["寓意","寓言想告訴我們的道理。"],["狐假虎威","倚仗別人的權勢嚇唬、欺負人。"],["文言文","古代的書面語，句子精簡。"],["白話文","和我們平常說話接近的寫法。"],["從容不迫","不慌不忙、很鎮定。"],["臨危不亂","遇到危險也不慌亂。"],["虛張聲勢","故意裝出強大的樣子嚇人。"],["事實","真實發生、可以查證的事。"],["觀點","個人的看法。"]],"n":11},{"uid":"g6-chi-4","no":4,"name":"擁抱經典的真情","full":"擁抱經典的真情（第十課 耶誕節／第十一課 下午茶風波／第十二課 橘子／學習地圖四／閱讀階梯二 心靈小詩）","group":"","wk":[16,21],"points":["文體：小說（課程計畫參考書目為美國作家奧爾柯特的《小婦人》，推斷取材自這本書）。","原著背景：《小婦人》寫馬區家四姊妹梅格、喬、貝絲、艾美的成長；原著裡有一段有名的耶誕節情節，四姊妹把自己豐盛的早餐送給更貧困的鄰居家庭。","主旨大意（推斷）：在節日裡把愛分給需要的人，體會付出帶來的溫暖。","寫作手法：｜用小說架構分析情節：開始、發展、高潮、結局。｜場景描寫：寫出人物的動作、位置、對話和想法，營造故事氣氛。","文體：小說（參考書目為加拿大作家蒙哥馬利的《綠屋的安妮》，也就是常見譯名《清秀佳人》，推斷取材自這本書）。","原著背景：孤女安妮被綠屋的兄妹收養。原著中，安妮請好朋友黛安娜來喝下午茶，卻拿錯飲料，把酒當成果汁招待，黛安娜喝醉了，黛安娜的媽媽很生氣，不准兩人再來往；後來安妮在危急時救了黛安娜的妹妹，兩家才和好。","主旨大意（推斷）：誤會和衝突會發生，但真誠和勇氣可以修復友誼。","寫作手法：雙事件結構——用兩個事件（出錯的事件、補救的事件）推動情節，並歸納大意。","文體：小說（參考書目為《張曼娟讀芥川龍之介》，推斷取材自日本作家芥川龍之介的短篇小說〈蜜柑〉）。","原著背景：「我」心情低落的坐在火車上，一個鄉下小女孩一直想打開車窗，讓「我」很不耐煩；後來她從窗口把幾顆橘子丟給在路邊送行的弟弟們，那一幕讓「我」的心情一下子明亮起來。","主旨大意：一個小小的善意，也能帶給別人很大的力量；面對挫折和低落時，也能保持積極的心態。","學習重點：按照背景、原因、經過、結果說出故事大意；從人物的言行推知人物特質。","設問修辭：用問句來引起讀者注意。分成三種：｜提問：自己問，自己馬上回答。例如：「為什麼要練習？因為熟能生巧。」｜激問：問句裡已經藏著答案，答案在問題的反面。例如：「這麼簡單的事，誰不會呢？」（意思是人人都會。）｜懸問：心裡真的有疑問，問了沒有給答案。例如：「天上的星星，到底有多少顆呢？」","小說閱讀的方法：找出人物、背景（時間、地點）、情節（開始、發展、高潮、結局），再想想主旨。","文體：新詩。","學習重點：放聲朗讀體會詩意；上網查作者資料，了解創作背景幫助理解作品；把詩的內容轉成圖畫；仿寫或用照片、自然景物聯想寫一首詩。","不同的閱讀目的，要用不同的閱讀策略。"],"keys":[["小說","有人物、背景、情節的虛構故事。"],["情節","故事發生的經過。"],["場景描寫","寫出故事發生的地方和氣氛。"],["高潮","故事最緊張、最關鍵的地方。"],["雙事件結構","用兩個事件推動故事。"],["人物特質","人物的個性和特點。"],["設問","用問句引起注意的修辭。"],["提問","自問自答。"],["激問","答案在問題反面的問法。"],["懸問","只問不答的問法。"],["新詩","不講究固定字數和押韻的現代詩。"],["仿寫","模仿別人的句型或結構來寫。"]],"n":11}],"review":[]},{"key":"math","name":"數學","pub":"南一","units":[{"uid":"g6-math-1","no":1,"name":"質因數分解和短除法","full":"質因數分解和短除法","group":"","wk":[1,3],"points":["質數：只有 1 和自己兩個因數的數，例如 2、3、5、7、11、13、17、19。","合數：除了 1 和自己，還有別的因數，例如 4、6、8、9、10。","1 很特別：1 只有一個因數（就是 1），所以 1 既不算質數，也不算合數。","2 是唯一的偶數質數。","質因數：一個數的因數裡面，是質數的那些。例如 12 的因數有 1、2、3、4、6、12，其中質因數是 2 和 3。","質因數分解：把一個數寫成質數連乘。例如 12＝2×2×3，60＝2×2×3×5。","短除法：用質數一層一層往下除，除到商是質數（或 1）為止，左邊的除數和最下面的商乘起來就是答案。","快速判斷倍數：｜2 的倍數：個位數是 0、2、4、6、8。｜5 的倍數：個位數是 0 或 5。｜3 的倍數：每一位數字加起來是 3 的倍數。例如 471：4＋7＋1＝12，12 是 3 的倍數，所以 471 是 3 的倍數。","互質：兩個數的公因數只有 1，例如 8 和 9。","最大公因數：兩數共同因數裡最大的。用短除法時，把左邊「兩數一起除得盡」的除數全部乘起來。","最小公倍數：兩數共同倍數裡最小的。用短除法時，把左邊所有除數和最下面的兩個商全部乘起來。","生活應用小訣竅：題目講「最大」「平分」「裁成一樣大、不剩」通常用最大公因數；講「同時」「再次相遇」「一起出發」通常用最小公倍數。"],"keys":[["質數","只有 1 和自己兩個因數的數。"],["合數","因數超過兩個的數。"],["質因數","是質數的因數。"],["質因數分解","把數拆成質數相乘。"],["短除法","用質數一直往下除的直式寫法。"],["互質","兩數的公因數只有 1。"],["最大公因數","兩數共同因數中最大的那個。"],["最小公倍數","兩數共同倍數中最小的那個。"]],"n":10},{"uid":"g6-math-2","no":2,"name":"分數的除法","full":"分數的除法","group":"","wk":[4,5],"points":["最簡分數：分子和分母互質，不能再約分。例如 3/4、7/10。","約分：分子分母同時除以它們的公因數，用最大公因數一次約到最簡。例如 18/24，最大公因數 6，約成 3/4。","同分母分數相除：分母一樣時，直接用分子除分子。例如 6/7÷2/7＝6÷2＝3。","異分母分數相除：先通分變成同分母再相除；或用「除以一個分數＝乘以它的倒數」。例如 3/4÷5/8＝3/4×8/5＝6/5。","倒數：分子分母對調。2/3 的倒數是 3/2；5 的倒數是 1/5。","帶分數要先化成假分數再算。例如 2又1/2＝5/2。","整數÷分數：4÷2/3 意思是「4 裡面有幾個 2/3」，4×3/2＝6。","有餘數的分數除法：問「最多可以分幾份」時，商只取整數，剩下的就是餘數。驗算：除數×商＋餘數＝被除數。","被除數、除數和商的關係（被除數不為 0）：｜除數＝1，商＝被除數。｜除數比 1 小，商會比被除數大。｜除數比 1 大，商會比被除數小。","已知部分求全部：「某數的 2/5 是 12」，某數＝12÷2/5＝30。"],"keys":[["最簡分數","分子分母互質、不能再約的分數。"],["約分","分子分母同除以公因數。"],["通分","把分母變成一樣。"],["倒數","分子分母交換位置的數。"],["假分數","分子大於或等於分母的分數。"],["帶分數","整數加真分數的寫法。"],["餘數","分完之後剩下、不夠再分一份的量。"]],"n":11},{"uid":"g6-math-3","no":3,"name":"小數的除法","full":"小數的除法","group":"","wk":[6,7],"points":["除數是小數時，先把除數變成整數：被除數和除數同時乘 10、100…（小數點一起往右移同樣位數），商不變。｜例：12÷0.4 → 120÷4＝30。｜例：4.5÷0.15 → 450÷15＝30。","直式計算：除數的小數點往右移幾位，被除數的小數點也要往右移幾位，位數不夠就補 0。","商的小數點要對齊移動後的被除數小數點。","有餘數的小數除法：餘數的小數點要對齊「原來」被除數的小數點，這點最容易錯。｜例：10.5 公升油每瓶裝 0.8 公升 → 可裝 13 瓶，剩 0.1 公升。｜驗算：除數×商＋餘數＝被除數 → 0.8×13＋0.1＝10.5。","取概數：題目說「四捨五入到某一位」，就多算一位再四捨五入。","被除數、除數和商的關係（都是正數時）：｜除數比 1 小 → 商比被除數大。｜除數比 1 大 → 商比被除數小。"],"keys":[["被除數","被分的那個數。"],["除數","拿來除的數。"],["商","除出來的結果。"],["位值","數字在哪一位，代表的大小就不同。"],["驗算","用乘法檢查除法對不對。"],["四捨五入","要捨去的那一位是 4 以下就捨去，5 以上就進位。"]],"n":10},{"uid":"g6-math-4","no":4,"name":"圓周長和圓面積","full":"圓周長和圓面積","group":"","wk":[8,9],"points":["圓周率：任何大小的圓，圓周長÷直徑都是同一個數，約 3.14。圓再大或再小，圓周率都不會變。","公式（圓周率用 3.14）：｜圓周長＝直徑×3.14＝半徑×2×3.14｜直徑＝圓周長÷3.14｜圓面積＝半徑×半徑×3.14","直徑＝半徑×2。題目給直徑，算面積前要先除以 2。","估面積：把圖形放在方格紙上，數完整的格子，再把不完整的格子湊一湊，可以估出不規則圖形或圓的面積。","半徑變 2 倍：圓周長變 2 倍，圓面積變 4 倍（因為半徑乘了兩次）。","複合圖形：先拆成正方形、長方形、圓，再用加或減算出面積。例如「正方形挖掉一個圓」＝正方形面積－圓面積。","輪子滾一圈，前進的距離就是一個圓周長。"],"keys":[["圓心","圓正中間的點。"],["半徑","從圓心到圓周的線段。"],["直徑","通過圓心、兩端都在圓周上的線段，長度是半徑的 2 倍。"],["圓周長","繞圓一圈的長度。"],["圓周率","圓周長和直徑的比值，約 3.14。"],["圓面積","圓圍起來的大小。"]],"n":10},{"uid":"g6-math-5","no":5,"name":"比和比值","full":"比和比值","group":"","wk":[11,12],"points":["比：用「：」比較兩個量。例如紅球 3 顆、藍球 5 顆，紅球和藍球的比是 3：5。","前項、後項：3：5 中，3 是前項，5 是後項。順序不能隨便換，3：5 和 5：3 意思不同。","比值：前項÷後項。3：5 的比值是 3/5（0.6）。","相等的比：比值一樣的比。前項和後項同時乘或同時除以同一個數（0 除外），比值不變。例如 2：3＝4：6＝6：9。","最簡單整數比：前項和後項都是整數而且互質。｜整數比：同除以最大公因數。18：24 → 3：4。｜小數比：先同乘 10 或 100 變整數。0.6：1.5 → 6：15 → 2：5。｜分數比：同乘分母的最小公倍數。1/2：2/3 → 同乘 6 → 3：4。","比的應用：｜已知一部分求另一部分：糖：麵粉＝2：5，麵粉 300 克，糖＝300÷5×2＝120 克。｜已知總量求部分：男：女＝4：5，全班 27 人，男生＝27×4/9＝12 人。"],"keys":[["比","用「：」表示兩個量的關係。"],["前項","比號前面的數。"],["後項","比號後面的數。"],["比值","前項除以後項的結果。"],["相等的比","比值相同的兩個比。"],["最簡單整數比","前後項都是整數而且互質的比。"]],"n":10},{"uid":"g6-math-6","no":6,"name":"扇形的周長和面積","full":"扇形的周長和面積","group":"","wk":[13,14],"points":["扇形：圓被兩條半徑切出來的一塊，像一片披薩。","圓心角：兩條半徑夾的角。整個圓一圈是 360 度。","三個比相等：圓心角：360＝扇形弧長：圓周長＝扇形面積：圓面積。","公式（圓周率 3.14）：｜扇形弧長＝圓周長×（圓心角÷360）｜扇形面積＝圓面積×（圓心角÷360）｜扇形周長＝弧長＋半徑×2（別忘了兩條直直的半徑）","常見圓心角：180 度＝半圓（1/2）、90 度＝1/4 圓、60 度＝1/6 圓、45 度＝1/8 圓、120 度＝1/3 圓。","複合圖形：常見的是「正方形減掉 1/4 圓」或「長方形加半圓」，先畫圖拆開再算。"],"keys":[["扇形","由兩條半徑和一段弧圍成的圖形。"],["圓心角","頂點在圓心、兩邊是半徑的角。"],["弧","圓周上的一段。"],["弧長","那一段弧的長度。"],["周角","繞一圈的角，360 度。"]],"n":10},{"uid":"g6-math-7","no":7,"name":"速率","full":"速率","group":"","wk":[15,16],"points":["速率：表示快慢，就是「每單位時間走多遠」。","公式：｜速率＝距離÷時間｜距離＝速率×時間｜時間＝距離÷速率","比快慢：距離一樣，花的時間越短越快；時間一樣，走得越遠越快。","秒速、分速、時速：每秒、每分鐘、每小時走的距離。","單位換算（1 分＝60 秒，1 小時＝60 分＝3600 秒，1 公里＝1000 公尺）：｜秒速 → 分速：×60｜分速 → 時速：×60｜時速（公里）→ 秒速（公尺）：先×1000 變公尺，再÷3600。例如時速 72 公里＝72000÷3600＝秒速 20 公尺。","比較速率前，先把單位換成一樣。","時間有分鐘時，可以換成小時的小數或分數：30 分＝0.5 小時，1 小時 30 分＝1.5 小時。"],"keys":[["速率","單位時間內移動的距離。"],["秒速","每秒移動的距離。"],["分速","每分鐘移動的距離。"],["時速","每小時移動的距離。"],["距離","從起點到終點的長度。"]],"n":10},{"uid":"g6-math-8","no":8,"name":"數量關係","full":"數量關係","group":"","wk":[17,18],"points":["和不變：甲＋乙的和不變時，甲多幾，乙就要少幾。","差不變：兩數同時加上（或減去）同一個數，差不變。","積不變：甲×乙的積不變時，甲乘幾倍，乙就要除以同樣的倍數。例如 12×8＝24×4。","商不變：被除數和除數同時乘（或除以）同一個數（0 除外），商不變。例如 60÷15＝120÷30。","搭配問題：｜「分兩步、每步都要選」用乘法：3 件上衣配 4 件褲子＝3×4＝12 種。｜「只選一種方式」把各方式的數量加起來：搭公車 2 種路線或搭捷運 3 種路線，共 2＋3＝5 種。｜怕漏掉時，可以畫樹狀圖或列表一個一個數。","規律性問題：先列表看前幾個，找出「每次多幾」，再推到第 n 個。｜例：1、4、7、10…每次多 3，第 n 個＝1＋3×（n－1）。｜火柴排正方形一列：1 個用 4 根，之後每多 1 個正方形多 3 根，n 個用 3×n＋1 根。"],"keys":[["和","加起來的結果。"],["差","相減的結果。"],["積","相乘的結果。"],["商","相除的結果。"],["搭配","從幾組東西裡各選一個組合起來。"],["規律","反覆出現、有固定變化的樣子。"],["樹狀圖","像樹枝一樣分叉，列出所有可能的圖。"]],"n":11}],"review":[{"name":"評量週＋加油小站 1（複習單元 1–4）","label":"—","wk":[10,10]},{"name":"加油小站 2（複習單元 5–8）","label":"—","wk":[19,19]},{"name":"評量週＋數學探索「密數脫逃」（全冊總複習）","label":"—","wk":[20,20]},{"name":"休業式","label":"—","wk":[21,21]}]},{"key":"soc","name":"社會","pub":"翰林","units":[{"uid":"g6-soc-1","no":1,"name":"消費選擇與理財規劃","full":"消費選擇與理財規劃（聰明消費與權益／理財規劃與風險）","group":"","wk":[1,5],"points":["貨幣的演進：很久以前人們用「以物易物」交換東西，很不方便（要剛好對方想要你的東西）；後來有了貨幣，交易變簡單。每個國家有自己的貨幣，例如臺灣用新臺幣、日本用日圓。","多元支付方式：現金、電子票證（例如悠遊卡、一卡通）、信用卡、行動支付。｜好處：不用帶很多現金、有時有優惠。｜要小心：信用卡要按時繳費，忘了繳會多出額外的費用；電子支付也要注意帳號安全。","消費時要考慮的三件事：價格、品質、個人需求。同樣的東西，材料和做法不同，價錢就不同，要依自己的需要和能負擔的程度選擇。","分清楚「需要」和「想要」：需要是生活一定要有的，想要是有了更好、沒有也可以。","保障消費權益是消費者、業者、政府三方一起的責任：｜消費者：看清楚標示（成分、有效期限）、保留發票收據。｜業者：提供安全、標示清楚的商品。｜政府：訂法規、檢查把關。｜遇到消費糾紛：可以打「全國消費者服務專線 1950」，或向各地消費者服務中心申訴。","生產者怎麼吸引顧客：在市場競爭下，調整價格、提升品質、增加產品功能，同時想辦法賺到利潤。","友善環境的消費：愛惜物品延長使用時間、使用二手物品、舊物重製再利用。","理財的目的：讓錢有計畫的使用，達成目標（例如存錢買想要的文具、存畢業旅行費用），也為未來或意外做準備。","理財前的準備：記錄收入和支出、設定目標、先存再花。","常見理財方式：｜活期存款：隨時可以存取，很方便，利息比較少。｜定期存款：存一段固定時間，利息比活期多，但中途領出來會少拿利息。｜保險：遇到意外或生病時，幫忙減輕醫療等費用的負擔。｜買賣股票：可能賺比較多，也可能虧錢，風險比存款高。","風險：可能賺得越多的方式，通常風險也越高。理財要評估風險、結果，並自己承擔責任。"],"keys":[["以物易物","用東西直接交換東西。"],["貨幣","大家都接受、用來買賣的錢。"],["電子票證","可以儲值、刷卡搭車或付款的卡片。"],["行動支付","用手機付款。"],["需要","生活必需的東西。"],["想要","有了更好、沒有也能生活的東西。"],["消費權益","消費者買到安全、合理商品的權利。"],["1950","全國消費者服務專線。"],["理財","有計畫的管理和使用金錢。"],["活期存款","隨時可存可領的存款。"],["定期存款","約定存一段時間的存款。"],["風險","可能損失的程度。"]],"n":10},{"uid":"g6-soc-2","no":2,"name":"經濟轉型與生活轉變","full":"經濟轉型與生活轉變（戰後的社會發展／公共建設／科技島）","group":"","wk":[6,9],"points":["二次世界大戰後，臺灣從農業社會慢慢轉型成工商業社會。","土地改革（照顧農民）：｜三七五減租：地租最多只能收收成的 37.5%，農民可以留下更多收穫。｜耕者有其田：政府讓真正在耕作的農民擁有自己的田地，不用再繳地租。","美援：戰後美國提供麵粉、奶粉、布料等物資，也協助臺灣做建設，幫助經濟發展。","民國 40 年代（約 1950 年代）推動民生工業：自己生產日常用品（例如紡織品、食品），減少進口。","民國 50 年代（約 1960 年代）設立加工出口區：臺灣第一個加工出口區設在高雄，靠近港口，方便原料進口、產品出口。工廠把原料加工成家電、成衣等產品賣到國外，創造很多工作機會。","民國 60 年代（約 1970 年代）推動十大建設：改善交通和重工業等基礎建設，例如中山高速公路、鐵路電氣化、北迴鐵路、桃園國際機場（當時叫中正國際機場）、臺中港、蘇澳港、一貫作業大煉鋼廠、大造船廠、石油化學工業、核能發電廠。其中大煉鋼廠和大造船廠都在高雄。","交通建設縮短時間距離：中山高速公路通車前，從高雄到臺北要 9 個多小時；通車後南北往來快很多，貨物運輸和人員交流也更方便。","工業發展讓很多人從鄉村搬到都市工作，都市人口變多、越來越熱鬧，但也帶來交通擁擠、住房、汙染等問題。","民國 69 年（西元 1980 年）政府設立第一個科學園區（新竹科學園區），輔導廠商發展高科技產業，鼓勵企業投資和研發。","臺灣有專業人才、園區資源和完整的產業分工，高科技產業成為經濟的重要支柱。","之後也設立中部、南部等科學園區，帶動地方發展；同時要兼顧環境保護、用水用電和生活品質。"],"keys":[["農業社會","大部分人以種田為生的社會。"],["工商業社會","大部分人在工廠、公司、商店工作的社會。"],["三七五減租","地租不能超過收成 37.5% 的政策。"],["耕者有其田","讓耕作的農民擁有自己田地的政策。"],["美援","戰後美國給臺灣的物資和經濟援助。"],["民生工業","生產日常生活用品的工業。"],["加工出口區","進口原料、加工後出口的工業區。"],["十大建設","民國 60 年代推動的十項重大建設。"],["都市化","人口往都市集中、都市越來越大。"],["科學園區","集中發展高科技產業的園區。"]],"n":10},{"uid":"g6-soc-3","no":3,"name":"迎向科技發展新挑戰","full":"迎向科技發展新挑戰（資訊科技／能源科技／生物科技）","group":"","wk":[10,14],"points":["資訊科技（電腦、手機、網路）讓查資料、購物、聯絡都更方便。","潛藏的風險：｜網路購物可能遇到個人資料外流、賣家收錢不出貨或寄錯東西。｜點不明連結，電腦可能中毒、資料被偷。｜為了小禮物在網路填個人資料，可能被拿去做不好的事。｜隨便下載、分享別人的圖片、音樂、影片，可能侵犯著作權。","相關規範：例如著作權法、資通安全管理法。","人工智慧（AI）：已經用在生活中，例如汽車的自動駕駛功能、餐廳的送餐和點餐機器人。AI 帶來方便，也帶來新的問題，需要好好規範。","火力發電：燒煤、燒天然氣，會造成空氣汙染和全球暖化問題。","核能發電：少量原料就能發很多電，但一旦輻射外洩會造成嚴重災害，核廢料要放哪裡也一直有爭議。","再生能源：太陽能、風力、水力、地熱、潮汐、生質能等，汙染比較少，政府鼓勵發展。｜臺灣日照充足，適合發展太陽能發電。｜臺灣西部沿海風力穩定，適合發展風力發電。｜限制：太陽能受天氣和白天黑夜影響；風力要看風況；設置地點也常有爭議。","能源發展要有規範，政府會稽查發電廠並鼓勵發展再生能源。","基因改造：改變生物的基因，讓作物更耐蟲、更好吃。臺灣規定基因改造食品要標示，例如豆漿包裝上會寫用的是基因改造或非基因改造黃豆。有些人擔心食品安全，所以標示讓消費者自己選擇。","醫學上的應用：生物科技可以幫助治療疾病、研發藥物。","生物複製：複製技術引發兩難，例如失敗時責任歸誰、生命會不會被當成商品。","科技研究和使用，要符合法律和倫理規範；新科技出現時，政府的法令也會跟著修改。"],"keys":[["資訊科技","處理和傳遞資訊的技術，例如電腦、網路。"],["個人資料","姓名、電話、地址、身分證字號等能認出你是誰的資料。"],["著作權","創作者對自己作品的權利。"],["人工智慧（AI）","讓機器能學習、判斷的技術。"],["火力發電","燒煤或天然氣發電。"],["核能發電","利用核能發電，會產生核廢料。"],["再生能源","用不完、汙染少的能源，例如太陽能、風力。"],["基因改造","改變生物基因的技術。"],["倫理","人和人之間應該遵守的道理。"]],"n":10},{"uid":"g6-soc-4","no":4,"name":"生活中的規範與運作","full":"生活中的規範與運作（規範與權益／民主社會的運作）","group":"","wk":[15,18],"points":["規範有很多種：習俗、道德、宗教、法律。規範引導大家的行為，維持社會秩序。","傳統規範會隨社會變遷改變。例如博愛座：有人主張保留，讓需要的人很快有位子；也有人主張取消，因為讓座的美德好像變成被強迫的義務。這種討論表示社會的想法在改變。","道德和法律相輔相成：道德靠自己的良心和別人的眼光；法律有強制力，違反會受到處罰。法律的功能是維護秩序、促進社會進步。","保護特定族群的法律：｜《兒童及少年福利與權益保障法》：保護未滿 18 歲的兒童及少年，讓身心健全發展。｜也有針對原住民族的法律，保障原住民族的權益與文化。","憲法是國家最根本的法律，其他法律都要依據它。它規範人民的權利、義務，以及政府的組織。中華民國憲法從民國 36 年（西元 1947 年）12 月 25 日開始施行。","平等權：無論男女、宗教、種族、階級、黨派，在法律上一律平等。","憲法保障的權利還有：｜自由權：例如人身自由、言論自由、居住遷徙自由、宗教信仰自由等。｜參政權：例如選舉、罷免、創制、複決，以及應考試、服公職。","人民的基本義務：納稅、服兵役、受國民教育（受國民教育既是權利也是義務）。","政府組織分成中央政府和地方政府：｜中央政府：總統和五院，負責全國性的公共事務。五院是行政院、立法院、司法院、考試院、監察院。｜地方政府：由民選的直轄市長、縣市長領導，執行中央政策，也依地方需要推動建設。高雄市是直轄市。","人民參與公共事務：投票、表達意見、陳情、參與公民投票等，都能讓社會變得更好。"],"keys":[["規範","大家應該遵守的行為準則。"],["習俗","社會長期流傳下來的習慣。"],["道德","判斷對錯、靠良心約束的標準。"],["法律","由國家制定、有強制力的規範。"],["憲法","國家的根本大法。"],["平等權","在法律上人人平等的權利。"],["自由權","在法律範圍內自由行動與表達的權利。"],["參政權","參與政治、管理公共事務的權利。"],["義務","應該盡的責任。"],["五院","行政院、立法院、司法院、考試院、監察院。"],["直轄市","由中央直接管轄的市，例如高雄市。"],["公民投票","人民直接投票決定重要議題。"]],"n":10},{"uid":"g6-soc-5","no":5,"name":"四角辯論會（主題探究與實作）","full":"四角辯論會（主題探究與實作）","group":"","wk":[19,21],"points":["回顧學過的內容，找出自己有興趣的社會議題（例如再生能源、博愛座、生物科技規範）。","設計好問題：問題要能讓人有不同立場，例如「學校該不該全面使用再生能源？」","蒐集資料：找贊成和反對兩邊的資料，整理成表格，注意資料來源是否可信。","四角辯論：教室四個角落代表四種立場（例如非常同意、同意、不同意、非常不同意），每個人走到自己的立場，再輪流說理由。","說和聽一樣重要：清楚說出看法和理由，也專心聽別人為什麼這樣想；聽完可以換角落，表示想法改變了。","小小公投：用投票表達意見。公投的結果會影響公共事務，所以每一票都重要；同時要尊重和自己不同的觀點。","公民投票是政府和民間解決爭議的方式之一，過程中各方都能公開表達看法。"],"keys":[["議題","大家關心、有不同看法的問題。"],["立場","對一件事支持或反對的態度。"],["論點","支持自己立場的理由。"],["資料來源","資料是從哪裡來的。"],["四角辯論","用四個角落代表四種立場的討論方式。"],["公投","讓人民直接投票表達意見。"],["尊重","接納別人可以有不同的想法。"]],"n":8}],"review":[]},{"key":"sci","name":"自然","pub":"翰林","units":[{"uid":"g6-sci-1","no":1,"name":"熱的影響與傳播","full":"熱的影響與傳播（物質的變化與組成／熱的傳播／保溫與散熱）","group":"","wk":[1,5],"points":["熱脹冷縮：大部分的氣體、液體、固體，受熱體積變大，遇冷體積變小。","三者比較：氣體熱脹冷縮最明顯，液體其次，固體最不明顯（但還是會變）。","生活例子：｜天燈、熱氣球裡的空氣受熱膨脹。｜溫度計裡的液體，天熱上升、天冷下降。｜銅球加熱後變大，穿不過原本穿得過的銅環；冷卻後又能穿過。｜鐵軌、橋梁接縫留空隙，避免夏天膨脹擠壞。｜凹下去的乒乓球泡熱水，裡面的空氣膨脹，球會鼓回來。","物質由微小粒子組成，粒子一直在運動。｜固體：粒子排得緊密，只在原地小幅振動。｜液體：粒子可以滑動，所以會流動。｜氣體：粒子距離遠、跑得到處都是。｜水和水蒸氣是同一種粒子，只是排列方式和移動程度不同。","熱一定從高溫處往低溫處傳。","傳導：熱沿著物體由近到遠傳過去，主要發生在固體。金屬傳導快（鐵鍋、鋁鍋），木頭、塑膠、矽膠傳導慢（所以鍋柄常用這些材料）。","對流：液體或氣體受熱的部分往上升、冷的部分往下降，形成流動，把熱帶開。液體和氣體主要靠對流傳熱。｜暖爐放低處，熱空氣往上跑；冷氣裝高處，冷空氣往下沉。","輻射：不需要任何物質也能傳熱。太陽的熱就是輻射傳到地球的。圍著營火覺得暖、手靠近亮著的燈泡覺得熱，也是輻射。｜樹蔭、陽傘可以擋掉一部分輻射熱，所以比較涼。","保溫：想辦法減少熱的傳導、對流和輻射。例如：用衣服或毛巾包住、蓋緊蓋子減少空氣對流、把空氣抽掉變成真空層。","保溫瓶：雙層瓶身中間抽成真空，減少傳導和對流；蓋子蓋緊，減少熱跟著空氣跑掉。","散熱：反過來增加熱的傳播。例如：電腦、機車引擎有散熱片或風扇；熱湯攪一攪、吹一吹涼得快。","節能生活：善用保溫與散熱，可以少開冷氣暖氣，兼顧方便與環境永續。"],"keys":[["熱脹冷縮","受熱變大、遇冷變小的性質。"],["粒子","組成物質、非常微小的單位。"],["傳導","熱在物體裡由近到遠傳過去。"],["對流","液體或氣體因冷熱不同而流動，把熱帶走。"],["輻射","不靠物質就能傳熱的方式。"],["保溫","讓熱不容易跑掉。"],["散熱","讓熱更快跑掉。"],["真空","幾乎沒有空氣的空間。"]],"n":12},{"uid":"g6-sci-2","no":2,"name":"多變的天氣","full":"多變的天氣（水與天氣的關係／天氣圖與天氣變化／颱風與防災）","group":"","wk":[6,10],"points":["自然界的水有三種樣子：液態（雨、河水、海水）、固態（冰、雪、霜）、氣態（水蒸氣，眼睛看不到）。","雲和霧：空氣中的水蒸氣遇冷，變成很小的水滴或冰晶。飄在高空叫雲，靠近地面叫霧。所以霧可以想成「貼著地面的雲」。","雨：雲裡的小水滴越聚越大，空氣托不住就落下來。","露：夜晚地面和葉子變冷，旁邊空氣中的水蒸氣在表面凝結成小水珠。","霜：溫度更低（約 0°C 以下）時，水蒸氣在物體表面直接變成冰晶。露和霜都是水蒸氣遇冷形成，差別在溫度。","水循環：海洋、湖泊的水蒸發成水蒸氣 → 上升遇冷成雲 → 降雨或降雪 → 流進河川、滲入地下 → 回到海洋。水一直在自然界循環，所以要珍惜水資源。","衛星雲圖：人造衛星從太空拍的雲的分布，白色部分是雲。","地面天氣圖上的符號：｜等壓線：把氣壓相同的地方連起來的線。線越密，風通常越大。｜高氣壓（H）：中心氣壓比四周高，天氣多半晴朗。｜低氣壓（L）：中心氣壓比四周低，容易有雲、下雨。｜鋒面：冷氣團和暖氣團交界的地方，有冷鋒、暖鋒、滯留鋒。","鋒面通過會讓氣溫、雲量、風向、風力、降雨改變。冷鋒通過後，氣溫常常明顯下降。","梅雨：臺灣每年五、六月左右受滯留鋒影響，常常連續下雨。","颱風是形成在熱帶海洋上的強烈低氣壓，在衛星雲圖上看起來像一大團旋轉的白色雲，中間常有颱風眼。","北半球的颱風是逆時針旋轉。","颱風來時會有強風、豪雨，可能造成淹水、停電、山崩、土石流。","颱風資訊：注意中央氣象署發布的海上、陸上颱風警報，也可以看電視、廣播、官方網站或手機 App。","防颱準備：清理排水溝、固定或收好陽臺物品、準備手電筒和電池、飲用水與乾糧，颱風天不到海邊、山區或河邊。"],"keys":[["凝結","水蒸氣遇冷變成小水滴。"],["雲","飄在高空的小水滴或冰晶。"],["霧","靠近地面的小水滴。"],["露","物體表面凝結的小水珠。"],["霜","物體表面形成的小冰晶。"],["水循環","水在海洋、天空、陸地之間不停循環。"],["氣壓","空氣壓在物體上的力量。"],["等壓線","連接氣壓相同地點的線。"],["鋒面","冷暖氣團交界的地帶。"],["滯留鋒","停留在一地很久、移動很慢的鋒面。"],["颱風","熱帶海洋上形成的強烈低氣壓。"],["颱風眼","颱風中心、風雨比較小的區域。"]],"n":12},{"uid":"g6-sci-3","no":3,"name":"發現大地的奧祕","full":"發現大地的奧祕（大地的變動與影響／岩石、礦物與土壤／防災與地景保育）","group":"","wk":[11,15],"points":["四種作用：｜風化：岩石被風吹、日曬、雨淋、冷熱變化，慢慢變得鬆散碎裂。｜侵蝕：流水、風、波浪把地表的砂石和土壤刮走、削掉。｜搬運：把砂石帶到別的地方。｜堆積：水流變慢或風變小時，砂石掉下來堆在一起。","坡度和流水：河流上游坡陡、水流快，侵蝕和搬運強；中下游坡緩、水流慢，容易堆積。","海岸地形：海浪會侵蝕海岸，形成海蝕洞、海蝕溝、海蝕平臺等；海水也會搬運砂石堆積成沙灘、沙洲。","風、水、地震、火山都會改變地表；人類開山、填海、造林，也會改變地貌。","岩石有不同的外觀、顏色、質地。","岩石由一種或多種礦物組成，岩石裡大小、顏色不同的顆粒，可能是不同的礦物。","比較礦物硬度：互相刻劃，被刮出痕跡的比較軟。也可以用硬幣幫忙比較，硬度順序：石英＞硬幣＞方解石＞滑石。","岩石和礦物在生活中用途很多：建材、雕刻、飾品、生活用品。","土壤：岩石經過長時間風化成碎屑，再加上動植物遺體分解後的物質。形成土壤常常要上千年，所以要保育土壤（例如種樹、不亂開挖山坡地）。","化石：古代生物的遺骸或活動痕跡（例如足跡）。看化石可以推測當時的環境、生物的習性，也能推測地層的年代。","臺灣常見的天然災害：颱風、地震、洪水、山崩、土石流、乾旱。","地震報告會寫：發生時間、震央位置、深度、規模，以及各地的震度。｜規模：地震釋放的能量大小，一次地震只有一個規模。｜震度：各地感受到的搖晃程度，離震央近的地方通常震度比較大。","地震避難：趴下、掩護、穩住；遠離窗戶和會倒的櫃子；不要搭電梯。平時要演練逃生路線。","天然災害沒辦法準確預知時間，但事先準備可以減少損失。","地景保育：保護特殊的地形景觀，例如設立國家公園、自然保留區、地質公園。高雄田寮一帶的泥岩惡地（月世界）就是有名的特殊地景。"],"keys":[["風化","岩石慢慢變得鬆散碎裂。"],["侵蝕","地表被流水、風、海浪削掉。"],["搬運","砂石被帶到別處。"],["堆積","砂石停下來堆在一起。"],["海蝕洞","海浪長期拍打岩壁形成的洞。"],["沙洲","海水把砂堆積成的狹長陸地。"],["礦物","組成岩石的天然物質。"],["硬度","物質被刮刻時抵抗的程度。"],["土壤","岩石碎屑加上生物分解物。"],["化石","古代生物的遺骸或痕跡。"],["規模","地震能量的大小。"],["震度","某地搖晃的程度。"],["地景保育","保護特殊的地形景觀。"]],"n":12},{"uid":"g6-sci-4","no":4,"name":"電磁與生活","full":"電磁與生活（地球像個大磁鐵／認識電磁鐵／生活中電磁鐵的應用）","group":"","wk":[16,21],"points":["指北針的指針是一根小磁針，有 N 極和 S 極，靜止時 N 極指北、S 極指南。","磁極規則：同極相斥、異極相吸。","懸掛的磁鐵靜止時也會指向南北。","地球本身像一個大磁鐵（地磁）：地理北極附近是地磁的 S 極，所以會把指北針的 N 極吸過去，指針就指向北方。","指北針旁邊有磁鐵或鐵器時，會被干擾指錯方向。","通電的電線周圍會產生磁場，把指北針放在通電電線旁邊，指針會偏轉。","電流方向相反，指北針偏轉方向也相反。","電磁鐵：把漆包線往同一方向繞成線圈，中間放鐵釘，接上電池通電，就能吸迴紋針。","電磁鐵的特性：｜通電才有磁性，斷電磁性就消失（一般磁鐵一直有磁性）。｜也有 N 極和 S 極；改變電流方向，兩極會對調。｜線圈圈數越多，磁力越強。｜串聯的電池越多（電流越大），磁力越強。","用到電磁鐵的東西：電鈴、廢鐵回收場的電磁起重機、喇叭、馬達。","馬達裡有電磁鐵，電風扇、洗衣機、吹風機、電動玩具車會轉動，靠的就是馬達。","電磁波：手機、微波爐、收音機都和電磁波有關。一般建議：微波爐運轉時不要貼近、手機不要長時間貼著頭，使用時保持適當距離和時間。"],"keys":[["指北針","用小磁針指出南北方向的工具。"],["N 極","磁鐵指向北方的那一端。"],["S 極","磁鐵指向南方的那一端。"],["地磁","地球本身具有的磁性。"],["磁場","磁力作用的範圍。"],["電磁鐵","通電才有磁性的磁鐵。"],["線圈","導線一圈一圈繞起來的樣子。"],["漆包線","外層塗了絕緣漆的銅線。"],["馬達","利用電和磁讓東西轉動的裝置。"],["電磁波","手機、收音機、微波爐用來傳遞訊號或能量的波。"]],"n":12}],"review":[]}],"g4":[{"key":"chi","name":"國語","pub":"康軒","units":[{"uid":"g4-chi-1","no":1,"name":"第一單元 歡樂好時光","full":"第一單元 歡樂好時光（第一課 水陸小高手／第二課 放學後／第三課 我的籃球夢／學習地圖一）","group":"","wk":[1,5],"points":["第一課 水陸小高手｜文體：童詩。｜主旨大意：用有節奏的詩句寫出孩子在下課、課後活動中玩得開心、樣樣都拿手的樣子（細節以課本為準）。｜寫作手法／修辭：運用聯想和修辭寫童詩，並練習仿作一首自己的童詩；朗讀時注意抑揚頓挫和節奏感。｜語文重點：「耳」部和「女」部的字；多義詞「一般」在不同句子裡的意思（可以是「普通」、「通常」或「一樣」）。","第二課 放學後｜文體：記敘文。｜主旨大意：作者寫自己放學後的活動安排和感受，讓我們想想放學後的時間可以怎麼過（細節以課本為準）。｜寫作手法：依時間順序寫（順敘）；運用視覺、聽覺、嗅覺、味覺、觸覺等感官描寫生活。｜語文重點：形近字「警／驚」、「幸／辛」；學會歸納段落大意。","第三課 我的籃球夢｜文體：記敘文。｜主旨大意：寫一段和籃球有關、追逐夢想的經驗（細節以課本為準）。｜寫作手法：配合學習「倒敘法」，練習用倒敘寫作文。｜語文重點：多音字「彈」（ㄊㄢˊ：彈琴；ㄉㄢˋ：子彈）；人稱代名詞（我、你、他、我們、你們、他們）；刪去句子裡多餘的贅詞。","學習地圖一：比較「順敘」和「倒敘」。順敘是照事情發生的先後寫；倒敘是先寫結果或最精彩的一幕，再回頭寫經過。"],"keys":[["童詩","寫給兒童、用簡短有節奏的句子表達想像和感受的詩。"],["仿作","模仿一篇作品的形式，寫出自己的內容。"],["順敘法","依照時間先後順序寫。"],["倒敘法","先寫後來的結果，再回頭交代經過。"],["感官摹寫","用看、聽、聞、嘗、摸到的感覺來描寫。"],["贅詞","句子裡多餘、重複的字詞。"],["人稱代名詞","代替人名的詞，例如我、你、他。"],["多義詞","同一個詞在不同句子裡有不同意思。"]],"n":11},{"uid":"g4-chi-2","no":2,"name":"第二單元 人物寫真","full":"第二單元 人物寫真（第四課 永遠的馬偕／第五課 假如給我三天光明／第六課 攀登生命的高峰／學習地圖二）","group":"","wk":[5,9],"points":["第四課 永遠的馬偕｜文體：人物傳記（記敘文）。｜主旨大意：介紹從加拿大來到臺灣的馬偕。他在淡水一帶行醫（常幫人拔牙）、傳教、辦學校，把一生奉獻給臺灣，臺灣人一直記得他。｜寫作手法：依時間介紹人物的生平與貢獻；善用四字詞語讓句子簡潔有力。｜語文重點：「皆」部件的字；「當……就……」句型。｜延伸：馬偕有一句名言「寧願燒盡，不願朽壞」，表示寧可努力奉獻到最後，也不要白白浪費生命。現在的馬偕醫院就是用他的名字命名。","第五課 假如給我三天光明｜文體：詩歌（以人物為主題，藉事件間接抒情）。｜主旨大意：以美國作家海倫・凱勒為主角。她小時候生病，看不見也聽不見，在老師耐心的教導下學會溝通和讀書，後來努力幫助身心障礙的人。讓我們學會珍惜自己擁有的能力（細節以課本為準）。｜寫作手法：節奏明快的詩句；藉著敘述事件表達情感。｜語文重點：「毛」部的字；同音詞（讀音一樣、意思不同的詞）；找出用錯的詞並修改。","第六課 攀登生命的高峰｜文體：人物傳記（記敘文）。｜主旨大意：寫一位面對困難不放棄、一步步達成目標的人物，用「攀登高峰」比喻努力克服挑戰的人生（人物身分以課本為準）。｜寫作手法：審題、選材，練習寫「值得我學習的名人」。｜語文重點：形近字「朗／郎」；多音字「磨」（ㄇㄛˊ：磨練；ㄇㄛˋ：石磨）；用詞尾法造「頂」的詞（山頂、屋頂、頭頂）；「千變萬化」、「不知所措」的近義詞。","學習地圖二：人物傳記的讀法。讀傳記時注意人物做了什麼事、遇到什麼困難、怎麼面對，從這些事情推論出人物的特質（例如勇敢、堅持、有愛心）。"],"keys":[["人物傳記","記錄一個真實人物生平和事蹟的文章。"],["奉獻","把自己的力量、時間全心給別人或社會。"],["身心障礙","身體或心智某些功能受到限制。"],["同音詞","讀音相同、意思不同的詞，例如「公園」和「公元」。"],["千變萬化","形容變化非常多。"],["不知所措","慌張得不知道該怎麼辦。"],["特質","一個人特別的性格或優點。"]],"n":11},{"uid":"g4-chi-3","no":3,"name":"閱讀階梯一 種樹的人","full":"閱讀階梯一 種樹的人","group":"","wk":[9,10],"points":["文體：故事（記敘文）。","主旨大意：一位牧羊人在荒涼的土地上，一年又一年默默種樹，幾十年後荒地變成了森林，人們也回來居住。告訴我們：堅持做一件好事，能帶來很大的改變（細節以課本為準）。","閱讀策略：｜自然段：文章本來分好的段落（每段開頭空兩格）。｜意義段：把意思相近的幾個自然段合在一起，並幫它取名字。｜先寫出每個意義段的大意，再合起來寫成全文大意。｜好的大意要包含：人物、事情、結果，而且簡短清楚。"],"keys":[["自然段","作者原本分好的段落。"],["意義段","意思相關的自然段合併後的段落。"],["大意","用簡短的話說出文章主要內容。"],["荒涼","沒有人煙、很冷清的樣子。"],["默默","不出聲、不張揚地做事。"]],"n":9},{"uid":"g4-chi-4","no":4,"name":"第三單元 放眼看世界","full":"第三單元 放眼看世界（第七課 美味的一堂課／第八課 建築界的長頸鹿／第九課 請到我的家鄉來／學習地圖三）","group":"","wk":[11,15],"points":["第七課 美味的一堂課｜文體：記敘文。｜主旨大意：寫一堂和美食有關、讓人印象深刻的課，從食物認識不同的文化（細節以課本為準）。｜寫作手法：感官摹寫（寫出看到、聞到、嘗到的感覺）和動作分解（把一個動作拆成好幾個小步驟寫）。｜語文重點：「酉」部的字；嘆詞（哇、啊、唉、哎呀）可以表現情緒；轉折句型「沒想到……竟然……」；補充說明的短語。","第八課 建築界的長頸鹿｜文體：說明文。｜主旨大意：用「長頸鹿」比喻非常高的建築，介紹這座高樓的特色和設計（課程計畫參考書目為《觸碰天際的臺北101》，推定本課介紹臺北101，細節以課本為準）。｜寫作手法：「總分」結構，先總說，再分項說明；用表格做筆記整理重點；看標題預測內容。｜語文重點：形近字、多音字；多義詞「建築」（名詞：建築物；動詞：建造）；假設複句「如果……就……」。｜延伸常識：臺北101 高 508 公尺，裡面有巨大的「阻尼器」，可以減少強風和地震造成的搖晃。","第九課 請到我的家鄉來｜文體：說明文。｜主旨大意：介紹不同國家、不同地方的文化特色，邀請大家去認識（細節以課本為準）。｜寫作手法：「散列式」結構，各段並列介紹不同地方；客觀介紹當地的人文和景色。｜語文重點：「是」部件的字；反義詞；找出句子錯誤並修改。","學習地圖三：非連續文本。像通知單、表格、圖表、地圖這類不是一段一段文字組成的資料，要看標題、表格、圖片來找出重要訊息；寫說明文時，也可以用數據、圖表、圖片幫忙說明。"],"keys":[["說明文","客觀介紹事物、知識的文章。"],["總分結構","先總說重點，再分開詳細說明。"],["散列式","幾個段落平行並列，各自介紹一個項目。"],["動作分解","把一個動作拆成幾個小動作寫，讓畫面更清楚。"],["嘆詞","表示驚訝、感嘆等情緒的詞，例如「哇」、「唉」。"],["假設複句","表示「如果發生某事，就會有某結果」的句子。"],["非連續文本","表格、圖表、通知單等不是連續文字的資料。"]],"n":11},{"uid":"g4-chi-5","no":5,"name":"第四單元 魔法變變變","full":"第四單元 魔法變變變（第十課 奇幻旋律／第十一課 兔子先生等等我／第十二課 老鞋匠和小精靈／學習地圖四）","group":"","wk":[15,19],"points":["第十課 奇幻旋律｜文體：童詩（押韻詩歌）。｜主旨大意：用押韻、有節奏的詩句介紹各種有神奇功能的奇幻物品，帶讀者進入想像的世界（細節以課本為準）。｜寫作手法：押韻；朗讀時運用聲音大小、長短變化讀出節奏。｜語文重點：「扁」部件的字；和「山、水」有關的四字詞語，用拆字法理解意思。","第十一課 兔子先生等等我｜文體：奇幻故事。｜主旨大意：主角追著一隻兔子先生，進入充滿奇怪事情的奇幻世界（參考書目列有《愛麗絲夢遊仙境》，推定改寫自該故事，細節以課本為準）。｜寫作手法：用刪節號（……）表現說話斷斷續續、猶豫或緊張的語氣。｜語文重點：「皿」部的字；目的複句（為了……）；補充說明的短語。","第十二課 老鞋匠和小精靈｜文體：奇幻故事（格林童話）。｜主旨大意：貧窮的老鞋匠只剩下做一雙鞋的皮革，夜裡小精靈偷偷幫他做出漂亮的鞋子，生意越來越好。鞋匠夫婦為了感謝，做了小衣服和小鞋子送給小精靈。告訴我們要懂得感恩。｜寫作手法：對話表現人物心情；摹聲詞（滴答、嘖嘖）讓聲音更生動；選擇複句「不是……就是……」；練習寫奇幻故事。｜語文重點：形近字「買／賣」、「鐘／鍾」。","學習地圖四：擴寫。把一個簡單的句子加上時間、地點、動作、感受等細節，變成一個段落。並閱讀書法家王羲之的故事：他是東晉的大書法家，被稱為「書聖」，練字非常勤奮。"],"keys":[["奇幻故事","有魔法、神奇人物或不可能發生的事的故事。"],["押韻","句尾的字韻母相同或相近，讀起來很順口。"],["刪節號（……）","表示話沒說完、斷斷續續或省略。"],["摹聲詞","模仿聲音的詞，例如滴答、轟隆、叮咚。"],["選擇複句","從兩件事中選一個，例如「不是……就是……」。"],["目的複句","說明做一件事是為了什麼，例如「為了……」。"],["擴寫","把短句加入細節變成段落。"],["書聖","對王羲之的尊稱。"]],"n":14},{"uid":"g4-chi-6","no":6,"name":"閱讀階梯二 國王的噴泉","full":"閱讀階梯二 國王的噴泉","group":"","wk":[20,21],"points":["文體：故事（記敘文）。","主旨大意：國王想蓋一座華麗的噴泉，卻會影響百姓的用水和生活；故事中的人物要面對該不該、敢不敢去向國王說真話的考驗。讓我們思考公平正義和勇氣（細節以課本為準）。","閱讀策略：｜預測：根據標題和文章線索，猜猜接下來會發生什麼。｜因果關係：找出重要事件，想想「因為什麼，所以發生什麼」，再把事件按照前因後果排好順序。｜人物分析：從角色說的話和做的事，推論他的個性，並找出文章中的證據。｜讀者劇場：用對話演出故事，體會不同角色的個性。"],"keys":[["預測","根據線索猜測後來的發展。"],["因果關係","一件事（原因）造成另一件事（結果）。"],["人物分析表","整理角色言行和個性的表格。"],["證據","能支持自己想法的文章句子。"],["公平正義","對每個人都公平，做對的事。"]],"n":9}],"review":[]},{"key":"math","name":"數學","pub":"南一","units":[{"uid":"g4-math-1","no":1,"name":"一億以內的數","full":"一億以內的數","group":"","wk":[1,2],"points":["位名由右往左：個位、十位、百位、千位、萬位、十萬位、百萬位、千萬位、億位。","10 個一萬是十萬，10 個十萬是一百萬，10 個一百萬是一千萬，10 個一千萬是一億。","一億寫成 100000000（1 後面 8 個 0），也就是 10000 個萬。","讀大數的方法：從右邊每 4 位分一段，「萬」那一段先讀，再讀後面四位。例如 45300000 讀作「四千五百三十萬」。","中間有 0 的數，讀的時候要讀出「零」。例如 70068000 讀作「七千零六萬八千」。","數的分解：83512406 ＝ 8 個千萬＋3 個百萬＋5 個十萬＋1 個萬＋2 個千＋4 個百＋0 個十＋6 個一。","比大小：先比位數，位數多的比較大；位數一樣，就從最高位開始一位一位比。用「＞」「＜」表示。","以「萬」當單位做加減：2350 萬＋1870 萬，只要算 2350＋1870＝4220，答案是 4220 萬。"],"keys":[["位名","每一個位置的名字，例如萬位、千萬位。"],["位值","數字放在不同位置代表的大小不同，例如 5 在十萬位代表 500000。"],["定位板","把數字一格一格放進去、幫忙看清楚位值的表格。"],["億","10000 個萬，寫成 100000000。"]],"n":12},{"uid":"g4-math-2","no":2,"name":"乘法","full":"乘法","group":"","wk":[3,4],"points":["幾千乘以一位數：2000×4，先算 2×4＝8，再補上 3 個 0，得 8000。","四位數乘以一位數用直式，從個位開始乘，滿十要進位。","乘以幾十：23×40 可以想成 23×4×10，先算 23×4＝92，再乘 10 得 920。","二位數乘以二位數：把乘數拆成「幾十」和「幾」。例如 26×34＝26×30＋26×4＝780＋104＝884。","直式乘法時，乘「十位」得到的那一列要往左移一格（因為代表幾十）。","三位數、四位數乘以二位數也是同樣的拆法，最後把兩列加起來。"],"keys":[["被乘數","乘號前面的數。"],["乘數","乘號後面的數。"],["積","相乘的答案。"],["進位","某一位乘出來滿 10，就把十位的數加到左邊那一位。"]],"n":11},{"uid":"g4-math-3","no":3,"name":"角度","full":"角度","group":"","wk":[5,6],"points":["量角器上有內圈、外圈兩排刻度，都從 0 度到 180 度。","量角的步驟：① 量角器的中心點對準角的頂點；② 一條邊對準 0 度線；③ 看另一條邊落在哪個刻度。邊對準哪一圈的 0，就讀那一圈。","畫角的步驟：先畫一條邊，中心點對準端點，在要的度數點一個點，再把兩點連起來。","直角＝90 度；比 90 度小的叫銳角；比 90 度大、比 180 度小的叫鈍角。","平角＝180 度（兩條邊排成一直線）；周角＝360 度（轉一整圈）。","旋轉角：物體轉動的大小。和時鐘指針轉動方向一樣叫「順時針」，相反叫「逆時針」。分針從 12 轉到 3 是 90 度。","角度可以合起來（相加）或分開（相減）。常用的三角板角度：一塊是 90、45、45 度，另一塊是 90、60、30 度。"],"keys":[["頂點","角的兩條邊交會的那一點。"],["量角器","量角度的工具，半圓形，有內外兩圈刻度。"],["銳角／直角／鈍角","小於 90 度／等於 90 度／介於 90 到 180 度。"],["平角","180 度。"],["周角","360 度。"],["順時針","跟時鐘指針轉動方向相同。"]],"n":11},{"uid":"g4-math-4","no":4,"name":"除法","full":"除法","group":"","wk":[7,8],"points":["幾千除以一位數：8000÷4，想 8÷4＝2，答案 2000。","四位數除以一位數用直式，從最高位開始除；如果最高位比除數小（例如 2350÷4，千位 2 比 4 小），就從前兩位開始除，商會是三位數。","幾十除以幾十：80÷20 想成 8÷2＝4。","除數是二位數時要「估商」：把除數看成接近的整十數。例如 74÷18，把 18 看成 20，先試商 3；18×3＝54，餘 20，比 18 大，表示商太小，改商 4，18×4＝72，餘 2。","餘數一定要比除數小。","驗算：除數×商＋餘數＝被除數。","生活應用要想清楚：「最多可以裝幾袋」用商就好；「至少要幾輛車」有餘數時要再加 1。"],"keys":[["被除數","要被分的數。"],["除數","分成幾份或每份幾個的那個數。"],["商","除出來的答案。"],["餘數","分完剩下、不夠再分的數。"],["估商","先猜一個商，再檢查要不要調大或調小。"]],"n":12},{"uid":"g4-math-5","no":5,"name":"三角形","full":"三角形","group":"","wk":[9,9],"points":["看「邊」分類：三條邊一樣長是正三角形；有兩條邊一樣長是等腰三角形。","看「角」分類：有一個直角是直角三角形；三個角都是銳角是銳角三角形；有一個鈍角是鈍角三角形。","等腰直角三角形：兩條邊一樣長，又有一個直角，另外兩個角都是 45 度。","正三角形的三個角一樣大，都是 60 度；正三角形也算是一種特別的等腰三角形。","等腰三角形的兩個底角一樣大。","可以用直尺和三角板畫出直角三角形、等腰三角形和正三角形。","全等：兩個圖形疊在一起能完全重合，形狀和大小都一樣。全等三角形中，互相重疊的點叫對應點，對應的邊一樣長，對應的角一樣大。","圖形移動、旋轉或翻面以後，形狀大小不會變，仍然和原來全等。"],"keys":[["正三角形","三邊等長。"],["等腰三角形","兩邊等長，這兩條邊叫「腰」。"],["直角／銳角／鈍角三角形","依照最大的那個角來分。"],["全等","可以完全疊合。"],["對應邊、對應角","全等圖形中，疊在一起的邊和角。"]],"n":11},{"uid":"g4-math-6","no":6,"name":"分數","full":"分數","group":"","wk":[11,12],"points":["真分數：分子比分母小，比 1 小，例如 3/5。","假分數：分子和分母一樣大或比分母大，等於 1 或比 1 大，例如 5/5、7/4。","帶分數：一個整數加上一個真分數，例如 2又3/4。","帶分數化成假分數：整數×分母＋分子，分母不變。2又3/4 ＝（2×4＋3）/4 ＝ 11/4。","假分數化成帶分數：分子÷分母，商是整數部分，餘數是新的分子。17/5：17÷5＝3 餘 2，所以是 3又2/5。","整數化成假分數：3 ＝ 15/5（3 個 5/5）。","分數數線：把 0 到 1 平分成幾格，每一格就是幾分之一；可以在數線上找出真分數、假分數、帶分數的位置，越右邊越大。"],"keys":[["分母","整體平分成幾份。"],["分子","取了其中幾份。"],["真分數／假分數／帶分數","比 1 小／大於或等於 1／整數加真分數。"],["數線","一條有刻度的直線，可以標出數的位置。"]],"n":11},{"uid":"g4-math-7","no":7,"name":"數量關係","full":"數量關係","group":"","wk":[12,13],"points":["百數表（1 到 100 排成 10 行）：往右一格多 1；往下一格多 10；往右下斜一格多 11；往左下斜一格多 9。","生活中的表格也有規律，例如月曆：往右一格多 1 天，往下一格多 7 天。","編碼的規律：例如座位每排 10 個，第 4 排第 6 個是 30＋6＝36 號。","數列規律：先找相鄰兩數差多少，例如 3、7、11、15，每次加 4。","圖形規律：觀察圖形每次怎麼轉（旋轉幾度、往哪個方向）或怎麼翻，就能推出下一個。","奇數和偶數：偶數可以兩個兩個分完（個位是 0、2、4、6、8），奇數會剩 1 個（個位是 1、3、5、7、9）。","加減規律：奇＋奇＝偶，偶＋偶＝偶，奇＋偶＝奇；減法也一樣（奇－奇＝偶，偶－偶＝偶，奇偶相減＝奇）。","乘法規律：奇×奇＝奇；只要有一個是偶數，積就是偶數。"],"keys":[["規律","重複出現、可以預測的變化方式。"],["百數表","把 1 到 100 排成十行十列的表。"],["奇數","除以 2 會剩 1 的整數。"],["偶數","可以被 2 整除的整數。"]],"n":11},{"uid":"g4-math-8","no":8,"name":"整數四則","full":"整數四則","group":"","wk":[14,15],"points":["併式：把兩步驟的問題寫成一個算式。","只有加和減：由左往右算。85－27＋13，先算 85－27＝58，再算 58＋13＝71。","只有乘和除：也由左往右算。96÷4×3，先算 96÷4＝24，再算 24×3＝72。","有括號：括號裡面先算。","加減和乘除混在一起：先乘除，後加減。18＋6×5＝18＋30＝48。","連減兩個數，等於減去這兩個數的和：500－120－80＝500－（120＋80）。","連除兩個數，等於除以這兩個數的積：240÷4÷2＝240÷（4×2）。"],"keys":[["併式","把好幾個步驟合成一個算式。"],["括號","（　），表示裡面要先算。"],["四則運算","加、減、乘、除。"],["先乘除後加減","同一個算式裡有加減也有乘除時的計算約定。"]],"n":12},{"uid":"g4-math-9","no":9,"name":"小數","full":"小數","group":"","wk":[16,17],"points":["把 1 平分成 100 份，每份是 1/100，寫成 0.01，讀作「零點零一」。","二位小數：小數點右邊第一位是「十分位」，第二位是「百分位」。3.47 讀作「三點四七」，7 在百分位，代表 7 個 0.01。","換算：1 ＝ 100 個 0.01；0.1 ＝ 10 個 0.01；2.36 ＝ 236 個 0.01。","小數末尾的 0 可以去掉，大小不變：0.30 ＝ 0.3。","比大小：先比整數部分，再比十分位，再比百分位。0.5 比 0.48 大（十分位 5 比 4 大）。","小數加減用直式時，小數點一定要對齊；位數不夠可以補 0（5.2 寫成 5.20）。","用公分刻度尺認識小數數線：1 公分 ＝ 0.01 公尺，135 公分 ＝ 1.35 公尺。"],"keys":[["小數點","分開整數和小數部分的那一點。"],["十分位","小數點右邊第一位。"],["百分位","小數點右邊第二位。"],["0.01","一百分之一。"]],"n":12},{"uid":"g4-math-10","no":10,"name":"長度","full":"長度","group":"","wk":[18,19],"points":["1 公里（km）＝ 1000 公尺 ＝ 100000 公分。","公里用在很長的距離，例如城市和城市之間、馬拉松路線。","換算：4 公里 25 公尺 ＝ 4025 公尺（公尺部分要補成三位數，25 寫成 025）；6080 公尺 ＝ 6 公里 80 公尺。","複名數加法：公尺加起來滿 1000 就進位成 1 公里。","複名數減法：公尺不夠減，就從公里借 1 個 1000 公尺。","乘除時可以先換成公尺再算，最後再換回公里和公尺。"],"keys":[["公里（km）","長度單位，1 公里＝1000 公尺。"],["公尺（m）","1 公尺＝100 公分。"],["複名數","用兩個單位一起表示的量，例如 2 公里 350 公尺。"],["換算","把一種單位改寫成另一種單位。"]],"n":12}],"review":[{"name":"評量週（加油小站 1）","label":"—","wk":[10,10]},{"name":"評量週（加油小站 2、數學探索）","label":"—","wk":[20,20]}]},{"key":"soc","name":"社會","pub":"翰林","units":[{"uid":"g4-soc-1","no":1,"name":"家鄉的地圖與運用","full":"家鄉的地圖與運用（閱讀生活中的地圖／善用地圖好生活）","group":"","wk":[1,3],"points":["地圖是依照實際景物和各種資料畫出來的，比文字更容易一眼看懂。","常見的地圖：行政區域圖（看地方怎麼劃分）、交通路線圖（看站名和轉乘）、觀光導覽圖（看景點和交通）、電子地圖（可放大縮小、定位、導航、規劃路線）、衛星影像圖（看到地表建築的真實樣子、觀察土地怎麼使用）。","依照需求選地圖：去旅遊看觀光導覽圖；要規劃怎麼去，用電子地圖或交通路線圖。","地圖上的四個工具：｜圖名：地圖的名稱或主題。｜方向標：告訴我們哪邊是北方，用來辨識方位。｜比例尺：表示地圖縮小了多少，可以算出實際距離。｜圖例：用簡單符號代表實際景物（例如學校、河流、廟宇）。","看行政區域圖可以知道：家鄉有哪些區（鄉鎮市）、哪一區面積最大、哪些區靠海、和哪些縣市相鄰。","交通路線圖會標示站名、轉乘資訊，能看出沿途經過哪些地方；從甲地到乙地常常有好幾種路線可以選。","從觀光導覽圖能看出一個地方的自然環境和居民怎麼利用空間。例如日月潭在南投縣，風景優美，發展成觀光區；邵族是日月潭地區最早的住民，潭中的小島叫拉魯島。"],"keys":[["行政區域圖","顯示縣市、鄉鎮市區劃分的地圖。"],["電子地圖","在手機或電腦上使用、可放大縮小和導航的地圖。"],["衛星影像圖","用人造衛星從高空拍下的地表影像。"],["圖名","地圖的標題。"],["方向標","指出北方的符號。"],["比例尺","地圖上的距離和實際距離的比例。"],["圖例","地圖符號的說明。"],["導航","電子地圖帶路，告訴你怎麼走。"]],"n":10},{"uid":"g4-soc-2","no":2,"name":"家鄉的地形與氣候","full":"家鄉的地形與氣候（高低起伏的地形／千變萬化的氣候）","group":"","wk":[4,5],"points":["臺灣的五大地形：｜山地：高度超過 1000 公尺、地勢起伏大。例如玉山、雪山、阿里山。｜丘陵：在山地邊緣，高度不到 1000 公尺，坡度比較和緩。例如新竹丘陵、苗栗丘陵。｜台地：高度不到 1000 公尺、頂部比較平坦的高地。例如林口台地、桃園台地、八卦台地。｜盆地：四周地勢高、中間平坦，像一個盆子。例如臺北盆地、埔里盆地。｜平原：在河流出口或沿海，寬闊又平坦。例如嘉南平原、屏東平原、宜蘭平原。","地形會影響土地利用：平原地勢平坦、交通方便，適合居住和耕種，容易形成城市；丘陵常開闢成茶園、果園或梯田；山地有茂密森林，有的種高山蔬果、有的保留自然生態或設置休閒設施。","先民把氣候和生活的經驗寫成諺語和農民曆。例如「梅雨」：春末夏初陰雨綿綿，剛好是梅子成熟的季節；「秋老虎」：立秋以後還熱上好一陣子。","氣象觀測站會記錄氣溫、雨量、風向、風力、溼度等資料。","看氣候數據能發現：高度越高，氣溫越低（例如阿里山夏天比嘉義市區涼很多）；冬天時，臺灣北部比南部多雨、氣溫也比較低。","地形和氣候會影響家鄉的物產。例如新竹秋冬風大、少下雨，適合晒米粉；屏東氣候溫暖，出產洋蔥、蓮霧；恆春半島陽光充足，成為度假勝地。"],"keys":[["地形","地表高低起伏的樣子。"],["山地／丘陵／台地／盆地／平原","臺灣的五大地形。"],["土地利用","人們怎麼使用一塊土地，例如蓋房子、種田、種茶。"],["氣候","一個地方長時間的天氣特色。"],["諺語","流傳下來、說明生活經驗的短句。"],["農民曆","記錄節氣和農事建議的曆書。"],["氣象觀測站","記錄天氣資料的地方。"]],"n":11},{"uid":"g4-soc-3","no":3,"name":"家鄉的人口與生活","full":"家鄉的人口與生活（家鄉的人口組成／人口變化與發展）","group":"","wk":[6,8],"points":["人口分布會受地形、氣候、交通、工作機會影響。平原、盆地人多；山地人少。","人口增加：出生和「移入」（搬進來）；人口減少：死亡和「移出」（搬出去）。","一個地方人口變多的常見原因：交通方便、工作機會多、生活機能好（讀書、看病、購物方便）、新社區和公共建設完善。人口變少的原因：交通不便、生活機能不好、工作機會少。","人口年齡可以分成：幼年人口（0–14 歲）、青壯年人口（15–64 歲）、老年人口（65 歲以上）。","青壯年人口離開家鄉，會讓當地工作的人變老變少，也需要更多老人照顧和醫療服務。","過去家庭的小孩比較多，現在比較少；原因之一是民國 50 年代起政府推行家庭計畫，加上生育觀念改變。","少子化：出生的嬰兒變少。影響例如學生變少、有些學校班級變少甚至併校。政府用育嬰假、托育補助、設立公共托嬰中心等方式鼓勵生育。","高齡社會的原因：醫療進步、衛生環境改善、平均壽命變長，加上出生率降低。","長輩對家庭和社會貢獻很多，年紀大體力會衰退，需要我們多關心、多協助。"],"keys":[["人口分布","人住在哪些地方、多或少。"],["移入／移出","搬進來／搬出去。"],["生活機能","日常生活需要的便利程度，例如購物、就醫、上學。"],["少子化","出生的小孩越來越少。"],["高齡化","老年人口比例越來越高。"],["家庭計畫","過去政府推動、鼓勵家庭少生孩子的政策。"]],"n":10},{"uid":"g4-soc-4","no":4,"name":"家鄉的多元文化","full":"家鄉的多元文化（飲食文化／多元服飾／多元語言與命名）","group":"","wk":[9,11],"points":["各地氣候、出產的作物和生活習慣不同，發展出不同的飲食。例如臺灣常見的米食小吃：碗粿、粄條、米粉、米苔目；原住民族的竹筒飯；從越南傳進來的河粉。","遇到不熟悉的食物，可以試試看、不隨便批評；真的不喜歡，就委婉表達。","不同文化接觸會產生融合與創新的料理，例如把漢堡的麵包換成米飯的「米漢堡」，或在披薩上加臺灣在地食材。","服飾也受氣候、材料和生活需要影響。例如客家藍衫耐洗耐穿、方便工作；原住民族用織布織出各族特色的花紋圖案。","有些服飾和信仰或傳統有關，例如信仰伊斯蘭教的婦女外出會戴頭巾。對不同的穿著要用欣賞、尊重的態度。","現代設計師把傳統圖騰、染布工藝放進現代服裝，讓傳統服飾傳承又創新。","臺灣常見的語言：國語、閩南語（臺灣台語）、客家語、原住民族語、新住民語、英語等。學校有本土語言和新住民語課程。","每一種語言都值得被保障；說母語能傳承自己的文化。","命名方式反映文化：漢人的姓通常跟著父親或母親，名字常帶著長輩的祝福或依照家族輩分；有些原住民族的名字常取自大自然，也有親子連名（在名字後面加上父親或母親的名字）的習慣。","聽別人分享自己名字的由來時，要仔細聆聽、尊重對方。"],"keys":[["多元文化","許多不同文化同時存在、互相尊重。"],["飲食融合","不同文化的料理結合出新的口味。"],["客家藍衫","客家族群傳統的藍色衣服，耐穿方便勞動。"],["母語","出生後最早學會的家鄉語言。"],["新住民","從其他國家移居到臺灣生活的人。"],["親子連名","名字裡連著父親或母親名字的命名方式。"]],"n":10},{"uid":"g4-soc-5","no":5,"name":"家鄉的節慶與禮俗","full":"家鄉的節慶與禮俗（傳統節慶／現代節日／生命禮俗）","group":"","wk":[12,16],"points":["漢人的傳統節慶多半來自傳說、典故或習俗。","除夕是農曆年最後一天，家人團聚吃年夜飯，有貼春聯、發壓歲錢的習俗；傳說年獸怕紅色和巨響，所以有貼紅紙、放鞭炮的習慣。春節是農曆新年的開始，大家拜訪親友、互道恭喜。","元宵節是農曆一月十五日，又叫「小過年」，吃元宵（湯圓）、猜燈謎、賞花燈；各地還有特色活動，例如臺南鹽水蜂炮、臺東炸寒單。","清明節：回故鄉掃墓、祭拜祖先，表達懷念和感恩。","端午節：農曆五月五日，吃粽子、划龍舟、立蛋、在門口插艾草、配戴香包，祈求身體健康。","中秋節：農曆八月十五日，親友團聚、賞月、吃月餅和柚子，現在很多人也會烤肉。","原住民族的傳統祭典：例如阿美族在小米收穫後的豐年祭（大多在國曆 7 到 9 月），感謝豐收；邵族的祖靈祭；達悟族的飛魚祭。祭典多有感謝祖靈、祈求平安的意義。","來自其他文化的節日：聖誕節（12 月 25 日，慶祝耶穌誕生）、萬聖節；東南亞新住民帶來的潑水節（國曆 4 月中旬，用潑水祝福、迎接新年）。","國家的節日：開國紀念日（1 月 1 日）、國慶日（10 月 10 日），讓我們認識國家的歷史。其他國家也有，例如美國國慶日是 7 月 4 日。","為不同角色訂的節日：兒童節（4 月 4 日）、母親節（5 月的第二個星期日）、父親節（8 月 8 日）、教師節（9 月 28 日），可以親手做卡片表達感謝。","地方特色節慶結合在地文化或自然景觀，例如雲林國際偶戲節（雲林布袋戲文化深厚，布袋戲又叫掌中戲）、阿里山櫻花季。人潮多時也可能帶來交通擁擠、垃圾變多的問題。","生命禮俗（從出生到成年）：滿月、收涎（嬰兒約四個月大時，用餅乾在嘴邊擦一擦，祝福他少流口水）、度晬（滿一歲，常有抓周）、做十六歲（源自臺南安平，代表長大成人）；阿美族的成年禮要經過跑步等訓練，培養責任感。","婚禮習俗：漢人婚禮有拜別父母、新娘下車前摸橘子或蘋果、丟扇子等；魯凱族婚禮有盪鞦韆的習俗。"],"keys":[["傳統節慶","流傳很久、有典故的節日，大多用農曆計算。"],["小過年","元宵節的別稱。"],["豐年祭","阿美族感謝豐收的祭典。"],["潑水節","東南亞國家的傳統新年，用潑水祝福彼此。"],["地方特色節慶","結合當地文化或景觀發展出來的節慶活動。"],["生命禮俗","人生重要階段（出生、成年、結婚等）的儀式。"],["收涎","嬰兒約四個月大時的祝福儀式。"],["抓周","滿周歲時讓寶寶抓物品，象徵祝福。"],["做十六歲","源自臺南安平的成年禮。"]],"n":13},{"uid":"g4-soc-6","no":6,"name":"家鄉故事導覽員","full":"家鄉故事導覽員（專題探究）","group":"","wk":[17,21],"points":["這個單元是專題探究，用五個步驟介紹自己家鄉的故事：","地名常常藏著故事，例如來自早期原住民族的稱呼，或當地的地形、產業。","家鄉的故事可以是自然的（季節性的動植物）、歷史的（老廟、老街、水圳），也可以是發生過的災害和大家怎麼互相幫助。","訪問別人要有禮貌：先約時間、說明目的、仔細聽、做紀錄、最後道謝。","網路資料要多比對幾個來源，確認是不是可靠。"],"keys":[["專題探究","自己找問題、找資料、整理後提出成果的學習方法。"],["訪談","當面問別人問題、蒐集資料。"],["故事地圖","把故事發生的地點標在地圖上的作品。"],["導覽員","帶人參觀並解說的人。"],["地名由來","一個地方名字是怎麼來的。"]],"n":8}],"review":[]},{"key":"sci","name":"自然","pub":"翰林","units":[{"uid":"g4-sci-1","no":1,"name":"閃亮的天空","full":"閃亮的天空（一天的天空／月亮的位置／月相的變化）","group":"","wk":[1,5],"points":["一天當中，太陽、月亮、星星在天空的位置看起來都是由東向西移動，叫做「東升西落」。","太陽早上從東邊升起，中午位置最高，傍晚從西邊落下。觀察太陽時絕對不能用眼睛直視。","可以看地面上不會動的東西（例如旗桿）的影子方向改變，推知太陽位置在改變。","面向南方時：左手邊是東方，右手邊是西方，背後是北方。","夜晚天空中的星星亮度不一樣，有的亮、有的暗。沒有月亮的晚上，星星看起來更亮。","描述月亮的位置需要兩個資料：「方位」（用指北針找）和「高度角」。","高度角：月亮（或其他天體）和地平線之間的夾角。地平線是 0 度，正頭頂（天頂）是 90 度。","測量高度角的方法：用拳頭數（手臂伸直，一個拳頭大約 10 度，每個人拳頭大小不同，會有一點差異），或用自己做的高度角觀測器。","遠物與近物：物體離我們越遠，我們換個位置去量，高度角變化就越小。月亮離我們非常遠，所以在同一個場地的不同位置量，高度角幾乎一樣。","月亮的形狀叫做「月相」，會隨著日期改變，而且有規律，大約一個月循環一次。","古人長期觀察，發現月相和農曆日期有關：農曆十五左右是滿月，所以元宵節、中元節、中秋節（都是農曆十五）都看得到圓圓的月亮。","觀察月相要長時間記錄；有時候看不到月亮，可能是月亮和太陽同時在天上、月亮出現在我們睡覺的時間，或天氣不好。"],"keys":[["東升西落","天體從東邊升起、往西邊落下的現象。"],["方位","東、西、南、北等方向。"],["指北針","用來找出北方、判斷方位的工具。"],["高度角","天體和地平線之間的夾角。"],["天頂","觀察者正頭頂的位置，高度角 90 度。"],["拳頭數","手臂伸直，用拳頭疊加估計高度角的方法。"],["月相","從地球看到月亮亮的部分的形狀。"],["滿月","月亮看起來整個是圓的，大約在農曆十五前後。"]],"n":13},{"uid":"g4-sci-2","no":2,"name":"水域環境","full":"水域環境（認識水域環境／水生植物／水生動物／珍惜水域環境）","group":"","wk":[6,11],"points":["水域環境有很多種：河流、溪流、湖泊、水庫、溼地、海洋等；也有人做出來的，例如溝渠、圳、埤塘、魚池、水田。","不同的水域環境，大小、深淺、水流快慢、水質都不同，所以住著不同的生物。水生生物的生活會受到水質、水流、陽光和空氣影響。","去水邊調查前要準備：注意安全（一定要有大人陪同、不靠近危險水邊）、準備器材（如放大鏡、撈網、紀錄單、相機）、先想好要觀察什麼。","水生植物泡在水裡，要怎麼得到空氣？很多水生植物體內有「通氣組織」，可以儲存和運送空氣，也能幫忙漂浮。例如：布袋蓮膨大的葉柄裡有很多氣室；蓮藕切開有很多孔洞。","有些水生植物用柔軟的莖、葉柄或葉子來適應水流和水位變化，例如水蘊草會隨著水流擺動；睡蓮的葉柄柔軟，葉子能平貼在水面上。","水生植物依生長位置分四類：｜挺水性：根長在水底土裡，莖和葉挺出水面，通常長在淺水區。例如：蓮（荷花）、茭白筍。｜浮葉性：根長在水底土裡，葉子平貼在水面，葉柄會配合水深變化。例如：睡蓮、菱角。｜沉水性：整株都在水裡，根長在土裡，多長在較深的地方。例如：水蘊草、金魚藻。｜漂浮性：整株漂在水面上，會隨水位高低上下移動。例如：布袋蓮、浮萍。","水生動物的呼吸方式：｜用鰓：魚、蝦、蝌蚪等。鰓是扁平片狀的構造，能吸收溶在水裡的空氣。魚呼吸時鰓蓋會一開一合。｜用肺：烏龜、鴨子等，需要浮上水面換氣。｜用呼吸管：紅娘華、孑孓（蚊子的幼蟲）等，把呼吸管伸出水面。","水生動物的運動方式：魚身體是流線型，用鰭擺動游泳；田螺用腹足慢慢爬；蝦子用腳步行或游泳，緊急時會彎起身體往後彈。","青蛙的一生：卵 → 蝌蚪（有尾巴、用鰓呼吸、住在水裡）→ 先長出後腳、再長出前腳 → 尾巴慢慢變短消失 → 成蛙（用肺和皮膚呼吸，可以上岸生活）。","水生動物和陸生動物的差別：例如蝌蚪皮膚溼滑、用尾巴游泳、用鰓呼吸；蜥蜴皮膚乾燥粗糙、用腳爬行、用肺呼吸。","水域和人類生活：提供食物（魚蝦貝類）、娛樂（溯溪、划船、浮潛）、港口貿易、曬鹽等。","人類也會破壞水域：工廠排放廢水、亂丟垃圾、過度捕撈、濫墾山坡造成土石流。我們可以減少垃圾、不亂倒汙水、適量捕撈，讓水域環境可以永續利用。"],"keys":[["水域環境","有水的生活環境，例如河流、湖泊、海洋。"],["溼地","長期或季節性被淺水覆蓋的土地。"],["通氣組織","植物體內儲存和運送空氣的構造。"],["挺水性／浮葉性／沉水性／漂浮性植物","依照長在水中的位置分的四類水生植物。"],["鰓","水生動物在水中呼吸的器官。"],["呼吸管","某些水生昆蟲伸出水面吸空氣的管子。"],["流線型","前端圓鈍、後端漸細，在水中阻力小的形狀。"],["永續","好好使用資源，讓以後的人也能繼續使用。"]],"n":15},{"uid":"g4-sci-3","no":3,"name":"物質變變變","full":"物質變變變（影響物質變化的因素／溫度對物質的影響／酸與鹼對物質的影響）","group":"","wk":[12,16],"points":["物質會互相影響而改變。例如沙灘的沙長期被風吹，形狀和位置就會改變。","生活中很多變化都有影響它的「因素」：｜冰塊融化：受溫度影響。｜麵團膨脹：和酵母、溫度有關。｜鐵窗生鏽：和水、空氣有關（潮溼的地方比較容易生鏽）。","讓溫度上升的方法：陽光照射、燃燒（例如瓦斯爐）、摩擦生熱、用電加熱（例如電鍋、烤箱）。瓦斯加熱快但溫度不容易控制。","溫度改變時，物質的顏色、形態、大小、形狀可能改變。例如：玉米粒加熱變成爆米花；生雞蛋加熱後蛋白由透明變白、由液體變成固體。","要知道溫度改變多少，要用溫度計測量，不要只說「變熱、變冷」。","有些變化溫度回復後可以恢復原狀，例如巧克力加熱融化，冷卻後又變硬；有些不能恢復，例如青菜燙熟、雞蛋煮熟、爆米花。","生活中有「酸」字的物質，例如醋、檸檬汁，吃起來有酸味；小蘇打水、肥皂水屬於鹼性的東西，肥皂水摸起來滑滑的。","安全守則：不確定安全的東西絕對不能放進嘴巴；非食物不能嘗；聞氣味要用手搧聞，不可以直接把鼻子湊上去。","紫色高麗菜（紫甘藍）的汁液遇到酸或鹼會變色：遇到酸性的東西（如醋、檸檬汁）偏紅（粉紅），遇到鹼性的東西（如小蘇打水、肥皂水）偏綠（藍綠）。用看顏色的方法判斷，比用嘴嘗更安全。"],"keys":[["物質","占有空間、有重量的東西。"],["因素","會影響結果的原因或條件。"],["溫度計","測量溫度的工具。"],["可回復／不可回復的變化","溫度回到原來時，能／不能恢復原本的樣子。"],["酸性","例如醋、檸檬汁，嘗起來酸酸的。"],["鹼性","例如小蘇打水、肥皂水，肥皂水摸起來滑滑的。"],["搧聞法","用手把氣味搧向鼻子來聞，比較安全。"]],"n":13},{"uid":"g4-sci-4","no":4,"name":"聲光世界真有趣","full":"聲光世界真有趣（聲音的產生與傳播／光的直進與反射／聲音和光的應用）","group":"","wk":[17,21],"points":["聲音是物體「振動」產生的。敲三角鐵、拍鈴鼓、說話時摸喉嚨，都能感覺到振動；振動停止，聲音也就消失。","聲音要靠物質傳播：可以在空氣（氣體）、水（液體）和桌子、牆壁（固體）中傳播。例如在水中能聽到敲擊不鏽鋼筷的聲音；趴在桌上能聽到敲桌子的聲音。","動物會發出不同的聲音來溝通，例如求偶、警告同伴、標示地盤。","自己會發光的物體叫做「光源」，例如太陽、電燈、燭火。月亮自己不會發光，是反射太陽的光才看起來亮亮的。","光是直線前進的：手電筒照進直的水管，另一端看得到光點；把水管彎起來，光就過不去。","光照到不透明的物體會被擋住，就形成影子。","光照到表面光滑的物體（例如鏡子）會改變方向，叫做「光的反射」。反射後的光也是直線前進。","利用光的反射設計的東西：汽車的後照鏡、道路轉角的反光鏡、反光背心上的反光條、攝影用的反光板。","生活中常把聲音和光結合，用來傳遞訊息或提醒大家注意，例如救護車的警示燈和警笛、平交道的閃燈和鈴聲。"],"keys":[["振動","物體快速來回的動作，會產生聲音。"],["傳播","聲音或光從一個地方傳到另一個地方。"],["光源","自己會發光的物體。"],["直線前進","光的行進方向是直直的。"],["影子","光被不透明物體擋住形成的暗區。"],["光的反射","光碰到光滑表面後改變方向。"]],"n":13}],"review":[]}]}/*__END_CURRIC__*/;   // 115 上教材：單元、週次、學習重點、關鍵詞（沒有答案）

function secret(q){
  if(_sc.has(q.id)) return _sc.get(q.id);
  const bin = atob(q.s), key = new TextEncoder().encode(MCQ_KEY);
  const bytes = Uint8Array.from(bin, (c, i) => c.charCodeAt(0) ^ key[i % key.length]);
  const v = JSON.parse(new TextDecoder().decode(bytes)); _sc.set(q.id, v); return v;
}

function mk(w, h, fn){
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  const P = (a, b, col) => { x.fillStyle = col; x.fillRect(a | 0, b | 0, 1, 1); };
  const R = (a, b, ww, hh, col) => { x.fillStyle = col; x.fillRect(a, b, ww, hh); };
  const C = (cx, cy, r, col) => { x.fillStyle = col; for(let yy = Math.floor(cy - r); yy <= cy + r; yy++) for(let xx = Math.floor(cx - r); xx <= cx + r; xx++){ const dx = xx + .5 - cx, dy = yy + .5 - cy; if(dx * dx + dy * dy <= r * r) x.fillRect(xx, yy, 1, 1); } };
  fn(P, R, C);
  const im = x.getImageData(0, 0, w, h), d = im.data, o = new Uint8ClampedArray(d);
  const A = (a, b) => a >= 0 && b >= 0 && a < w && b < h && d[(b * w + a) * 4 + 3] > 0;
  for(let b = 0; b < h; b++) for(let a = 0; a < w; a++){ if(A(a, b)) continue; if(A(a - 1, b) || A(a + 1, b) || A(a, b - 1) || A(a, b + 1)){ const i = (b * w + a) * 4; o[i] = 27; o[i + 1] = 27; o[i + 2] = 42; o[i + 3] = 255; } }
  x.putImageData(new ImageData(o, w, h), 0, 0);
  return c;
}

    const ahead = G.mons.filter(m => m.row === r && m.x > px - 16 && targetable(m));
    p.t -= dt;
    if(ahead.length && p.t <= 0){
      p.t = D.rate; const y = rowY(r) + 14, dmg = (D.dmg || 0) * homeBonus(p.type);

          G.eshots.push({x:m.x - 2, y:sy, vx:-(m.x - 2 - tx) / tt, vy:(ty - sy) / tt, row, dmg:M.shot * (1 + 0.05 * (m.lvl - 1)), life:tt + 0.2});
