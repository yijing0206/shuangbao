  const r = $("sunv").getBoundingClientRect(), x = ev && ev.clientX ? ev.clientX : innerWidth / 2, y = ev && ev.clientY ? ev.clientY : innerHeight * .7;
  e.style.left = x + "px"; e.style.top = y + "px"; document.body.appendChild(e);
  requestAnimationFrame(() => requestAnimationFrame(() => { e.style.transform = `translate(${r.left - x}px,${r.top - y}px) scale(.7)`; e.style.opacity = ".2"; }));
  setTimeout(() => e.remove(), 1100);
}
function finishQuizQ(){
  if(!G) return;
  if(G.team) G.team.turn++;
  if(G.phase === "quiz"){
    G.quizLeft = Math.max(0, G.quizLeft - 1);
    if(G.quizLeft > 0){ nextQ(); hud(); return; }
    if(G.net){ netPrepDone(); return; }
    beginPrep(); return;
  }
  closeAsk();
}

function winLevel(){

  if(G.net){ netEnd(true); return; } G.done = true; G.phase = "won"; G.asking = false; clearTimeout(G.autoT); closeAsk(true); sfx.win();
  if(G.team){ SV.team.wins = (SV.team.wins || 0) + 1; credit(30); G.coinsGot += 30; const un = []; for(const p of G.team.players) if(p.prof){ const before = DEF_ORDER.filter(d => defOwnedBy(SV.kids[p.prof], d)); SV.kids[p.prof].wins.team = (SV.kids[p.prof].wins.team || 0) + 1; DEF_ORDER.forEach(d => { if(!before.includes(d) && defOwnedBy(SV.kids[p.prof], d)) un.push(`${p.name}：${DEF[d].el} ${DEF[d].n}`); }); } G.unlocked = un; save(); hud(); setTimeout(() => showResult(true, 3, G.stats.ans ? G.stats.first / G.stats.ans : 0), 900); return; }
  const ownBefore = DEF_ORDER.filter(d => defOwnedBy(kid(), d));
  const k = kid(), s = G.stats, acc = s.ans ? s.first / s.ans : 0;
  let stars = 1; if(G.hearts === G.maxHearts && acc >= 0.75) stars = 3; else if(G.hearts >= 2 && acc >= 0.5) stars = 2;
  k.stars[G.cid] = Math.max(k.stars[G.cid] || 0, stars); k.wins[G.cid] = (k.wins[G.cid] || 0) + 1;
  const bonus = 30 + stars * 10; k.coins += bonus; G.coinsGot += bonus;
  gainTrait("resp", "把一關完整打完");
  if(stars === 3) gainTrait("hero", "自己選關卡，拿到 3 顆星");
  if((k.losses[G.cid] || 0) > 0 || G.lostHeart) gainTrait("resil", "跌倒了還是站起來贏");
  k.subjWin[G.card.subject] = 1; if(Object.keys(k.subjWin).length >= 3 && G.card.subject !== k.lastSubj) gainTrait("cross", "跨科目闖關");
  k.lastSubj = G.card.subject; k.best = Math.max(k.best, s.best);
  G.unlocked = DEF_ORDER.filter(d => !ownBefore.includes(d) && defOwnedBy(k, d)).map(d => `${DEF[d].el} ${DEF[d].n}`); save(); hud();
  setTimeout(() => showResult(true, stars, acc), 900);
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if(!b || b.disabled) return; const d = b.dataset;
  if(d.go){ go(d.go); return; }
  if(d.kid){ SV.cur = d.kid; save(); renderTitle(); return; }
  if(d.sub){ subTab = d.sub; renderLevels(); return; }
  if(d.lv){ startLevel(d.lv); return; }
  if(d.buy){ const D = DEF[d.buy], k = kid(); if(k.coins >= D.price){ k.coins -= D.price; k.unlock[d.buy] = 1; save(); toast(`🌱 解鎖 ${D.n}！`); renderShop(); } return; }
  if(d.upg){ const U = UPGRADES.find(u => u.k === d.upg), k = kid(); if(k.coins >= U.price){ k.coins -= U.price; k.upg[U.k] = 1; save(); toast(`${U.e} 買到 ${U.n}！`); renderShop(); } return; }
  if(d.seed){ if(!G || G.done || G.asking) return; G.sel = G.sel === d.seed ? null : d.seed;
    if(G.sel && G.sel !== "shovel"){ const D = DEF[G.sel]; if(G.sun < D.cost){ toast(`還差 ${D.cost - G.sun} ☀，答對題目就有！`); G.sel = null; } else if(G.seedCd[G.sel] > 0){ toast("種子還在充能中⋯"); G.sel = null; } else toast(`🌱 點草地種下「${D.n}」`, 1300); }
    else if(G.sel === "shovel") toast("🧹 點要移除的植物（退一半陽光）", 1300);
    renderSeedsLight(); return; }
  if(!G && (d.opt !== undefined || d.mtog !== undefined || d.mmap !== undefined)) return;
  if(d.opt !== undefined){ answer(Number(d.opt), ev); return; }
  if(d.mtog !== undefined){ if(G.qs.done) return; const sel = mqSel(G.q), k2 = Number(d.mtog), at = sel.indexOf(k2); if(at >= 0) sel.splice(at, 1); else sel.push(k2); renderQ(); return; }
  if(d.mmap !== undefined){ if(G.qs.done) return; const sel = mqSel(G.q), r = Number(d.mmap), v = Number(d.v); sel[r] = sel[r] === v ? -1 : v; renderQ(); return; }
  if(d.msub){ mqSubmit(ev); return; }
  if(d.mclr){ G.qs.msel = null; renderQ(); return; }
  if(d.next){ finishQuizQ(); return; }
  if(d.askmore){ if(!G || G.done) return; if(G.team) G.team.turn++; G.asking = true; nextQ(); $("qp").classList.add("on"); hud(); return; }
  if(d.playon){ if(G && G.team) G.team.turn++; closeAsk(); return; }
  if(d.tts){ if(G && G.q && SBS) SBS.speak(SBS.qSpeech(G.q), G.q.g === "g2"); return; }
  if(d.hintc){ if(G && G.qs){ G.qs.hint = !G.qs.hint; renderQ(); } return; }
  if(d.planter !== undefined){ if(G && G.team && G.team.split){ G.team.planter = Number(d.planter); G.sel = null; hud(); renderSeedsLight(); toast(`🌱 換 ${esc(planter().name)} 種植物（第 ${planter().rows.map(x => x + 1).join("、")} 排）`, 1500); } return; }
  if(d.skill){ useSkill(d.skill); return; }
  if(d.study){ if(SBS) SBS.open(SV.cur); return; }
  if(d.tadd !== undefined){ teamAdd(d.tadd); return; }
  if(d.tdel !== undefined){ TEAMS.splice(Number(d.tdel), 1); renderTeam(); return; }
  if(d.tg2 !== undefined){ const i = Number(d.tg2); TEAMS[i].g = d.g; renderTeam(); return; }
  if(d.tsplit !== undefined){ TEAM_SPLIT = d.tsplit === "1"; renderTeam(); return; }
  if(d.tgo){ teamGo(); return; }
  const a = d.act; if(!a) return;
  if(a === "pause") pauseGame();
  else if(a === "resume"){ closeModal(); if(G){ G.paused = false; lastT = performance.now(); } }
  else if(a === "quit" || a === "tolevels") quitLevel();
  else if(a === "retry"){ if(G.team){ const ps = G.team.players.map(p => ({name:p.name, g:p.g, prof:p.prof})), sp = G.team.split; startTeam(ps, sp); } else { const cid = G.cid; startLevel(cid); } }
  else if(a === "ask"){ if(G && (G.phase === "wave" || (G.net && G.phase === "prep")) && !G.done) openAsk(); }
  else if(a === "gowave"){ if(G && G.phase === "prep" && !G.done && (!G.net || G.net.host)) startWave(); }
  else if(a === "story"){ const v = ($("storyIn").value || "").trim(); if(v.length < 4){ toast("多寫幾個字喔 ✏️"); return; } kid().story.push({d:today(), cid:G.cid, t:v}); save(); gainTrait("story", "把學到的事寫下來"); b.disabled = true; b.textContent = "✅ 已送出"; }

  else if(a === "close") closeModal();
  else if(a === "settings") renderSettings();
  else if(a === "famswitch"){ closeModal(); SB_FAMILY.switchFamily(); }
  else if(a === "tg"){ SV.set[d.k] = !SV.set[d.k]; save(); renderSettings(); }
});

function teamGo(){ if(TEAMS.length < 2){ toast("至少 2 個人才能團體戰"); return; } startTeam(TEAMS.map(p => ({name:(p.name || "朋友").slice(0, 10), g:p.g, prof:p.prof || null})), TEAM_SPLIT); }
const _go = go; go = function(s){ _go(s); if(s === "team") renderTeam(); };
document.addEventListener("input", ev => { const t = ev.target; if(t && t.id === "g2name"){ SV.names.g2 = t.value.trim().slice(0, 8); save(); } });

/* ---------- 啟動 ---------- */
if(FAM && FAM.role && FAM.role !== "both"){ const kk = SB_FAMILY.kidOfSlot(FAMID, FAM.role); if(kk && GRADES.includes(kk.g)) SV.cur = kk.g; }
if(SBS) SBS.init({curric:CURRIC, getQs:uid => (UQ[uid] || []), secret, names:() => oldNames(), grades:GRADES, onReward:() => {}});
buildSprites();
go("title");
// 測試用掛勾（不含任何答案）
window.__garden = {get G(){ return G; }, get SV(){ return SV; }, startLevel, startTeam, useSkill, UNITS, semWeek, startWave, startQuiz, beginPrep, openAsk, closeAsk, fieldFrozen, fitCanvas, spawnMon, placePlant, nextQ, renderQ, version:GARDEN_VERSION, winLevel, loseLevel, net:{get NET(){ return NET; }, netCreate, netJoin, netStartPrepClick, netGoBattle, netLeave, netSide}};
